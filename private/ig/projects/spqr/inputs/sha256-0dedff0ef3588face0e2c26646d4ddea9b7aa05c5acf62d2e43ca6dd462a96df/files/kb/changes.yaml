notes: |
  Instrukcja 5. edycji nie oznacza zmian kolorem. Nota z 1.0 zapowiada, że istotne zmiany względem 4. edycji są opisane notami Design/Play Note — w całym
  tekście tylko jedna nota mówi to wprost (C-01). Pełnego rejestru zmian nie da się zbudować bez tekstu 4. edycji (brak w `sources.rules`).
changes:
  - id: C-01
    kind: version
    from_version: "4th Edition"
    to_version: "5th Edition"
    place: "7.24 (Design Note), s. 21"
    change: Złagodzono zakaz „nigdy nie zmieniaj ukierunkowania w strefie kontroli wroga” z wcześniejszych edycji.
    effect: Jednostka w strefie kontroli tylko jednej jednostki wroga, bez wroga w swojej strefie kontroli, pozostająca w heksie, może zużyć do ½ MA na obroty.
    rules: "7.24"
    refs: [R-7.24.1]
  - id: C-02
    kind: version
    from_version: "4th Edition"
    to_version: "5th Edition"
    place: "1.0 „5th Edition Note”, s. 2"
    change: Zasady i scenariusze przeredagowano, włączając wszystkie znane erraty i wyjaśnienia; brzmienie części zasad wspólnych dla serii ujednolicono z nowszymi tytułami GBoH.
    effect: 5. edycja zastępuje wszystkie wcześniejsze. Poszczególnych zmian (poza C-01) nie da się wskazać bez tekstu 4. edycji.
    rules: "1.0"
    refs: [R-1.0.2, C-01]
  - id: C-03
    kind: version
    from_version: "nieznana"
    to_version: "5th Edition"
    place: "6.83 Play Note #2, s. 19"
    change: "[wniosek] Sformułowanie „As the rule now reads” sugeruje zmianę: znacznik PW nie musi wskazywać konkretnej linii — dowódca może użyć PW dla dowolnej uprawnionej linii w zasięgu 2 heksów."
    effect: Gracze mogą (opcjonalnie) zapisywać linię; zasada nie wymaga tego. Charakter zmiany niepotwierdzony.
    rules: "6.83"
    refs: [R-6.83.4]
