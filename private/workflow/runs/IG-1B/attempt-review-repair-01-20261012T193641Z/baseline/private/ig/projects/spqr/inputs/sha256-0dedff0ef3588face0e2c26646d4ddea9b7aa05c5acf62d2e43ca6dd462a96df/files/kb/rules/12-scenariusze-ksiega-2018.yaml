    section: "SC2 Bagradas — Retreat Edge"
    source: {text: "księga scen. 2018 (4. ed.), Bagradas „Retreat Edge”, s. 10", pages: "10", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
