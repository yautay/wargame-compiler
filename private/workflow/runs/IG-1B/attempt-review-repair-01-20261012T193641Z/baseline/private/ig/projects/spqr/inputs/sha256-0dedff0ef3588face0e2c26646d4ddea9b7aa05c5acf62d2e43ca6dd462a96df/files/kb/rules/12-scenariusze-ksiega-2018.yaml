chapter: {id: "12", title: "12. Scenariusze — księga scenariuszy 4. edycji (2018): Beneventum, Bagradas, Kanny, Zama, Kynoskefalaj, scenariusz szkoleniowy"}
rules:
  # --- SC0: zasady ogólne księgi (s. 2) ---
  - id: R-SC0-1
    title: Gra rywalizacyjna — licytacja punktów ucieczki (Rout Point Bid)
    section: "SC0 Rules for Competitive Play #1"
    source: {text: "księga scen. 2018 (4. ed.), „Rules for Competitive Play” #1, s. 2", pages: "2", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    when: "gracze chcą wyrównać szanse w bitwie niezbalansowanej historycznie (zalecane dla graczy znających grę i bitwę)"
    effect: |
      Gracze licytują punkty ucieczki (RP) za prawo gry wybraną (zwykle faworyzowaną) stroną. Zwycięzca licytacji **odejmuje** zaoferowaną liczbę RP od progu
      wycofania swojej strony. Przykład: Zama — gracz #2 oferuje 35 RP za Scypiona; jego armia wycofuje się przy **195** RP zamiast 230.
    keywords: [licytacja RP, gra rywalizacyjna, próg wycofania, wyważenie]
    flags: [title-specific, optional]
    refs: [R-11.2.2, R-11.0.1, T-42]
  - id: R-SC0-2
    title: Gra rywalizacyjna — poprawki zasad (Game Rule Fix)
    section: "SC0 Rules for Competitive Play #2"
    source: {text: "księga scen. 2018 (4. ed.), „Rules for Competitive Play” #2, s. 2", pages: "2", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Drugi sposób wyrównania szans: księga przy każdej bitwie (sekcja „Difficulty and Balance”) wskazuje zasady, które należy zastosować albo pominąć
      („Rules Fix”). Wynik może wtedy odbiegać od historycznego.
    keywords: [poprawka zasad, Rules Fix, wyważenie]
    flags: [title-specific, optional]
    refs: [R-SC1-1, R-SC2-1, R-SC3-1, R-SC4-1, R-SC5-1]
  - id: R-SC0-3
    title: Tabele „Size and Troop Quality” w warunkach zwycięstwa
    section: "SC0 Size and Troop Quality Charts"
    source: {text: "księga scen. 2018 (4. ed.), „Size and Troop Quality Charts”, s. 2", pages: "2", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Tabela w sekcji zwycięstwa każdej bitwy podaje liczbę jednostek, łączne Size armii, łączne RP i średnie TQ na jednostkę. Średnie TQ liczy się z TQ
      jednostek (nie z RP) — także dla harcowników, słoni i jednostek podwójnych. Dane: T-42.
    keywords: [Size, TQ, Rout Ratio, statystyki armii]
    flags: [title-specific, summary]
    refs: [T-42, R-11.1.1]
  # --- SC1: Beneventum, 275 p.n.e. (s. 3–7, 10) ---
  - id: R-SC1-1
    title: Beneventum — mapa, warianty i wyważenie
    section: "SC1 Beneventum — General Information"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „General Information”, s. 4", pages: "4", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Mapa Beneventum. Dwa warianty: **Atak nocny / bitwa spotkaniowa** (Night Attack/Meeting Engagement — Rzymianie w obozie, Epiroci wchodzą marszem
      podejścia) oraz **swobodne rozstawienie** (Free Set-Up, bitwa ustawiona — R-SC1-13). Rzymianie są lekko faworyzowani (bardziej w bitwie ustawionej);
      zalecana metoda wyrównania — licytacja RP (R-SC0-1). Czas gry: ok. 2 godz. (ustawiona), +1 godz. (spotkaniowa).
    notes: "Nazewnictwo wariantów w księdze jest niespójne (nagłówek „THE MEETING ENGAGEMENT” stoi nad wariantem swobodnym) — N-44."
    keywords: [Beneventum, mapa, warianty, wyważenie]
    flags: [title-specific]
    refs: [R-SC1-13, R-SC0-1, N-44, T-43]
  - id: R-SC1-2
    title: Beneventum (atak nocny) — rozstawienie rzymskie w obozie
    section: "SC1 Beneventum — Initial Deployment (Roman)"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „The Roman Army under Curius Dentatus”, s. 4", pages: "4", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Rzymianie używają legionów i al III i V, rozstawionych **w obozie** wg T-43 (ukierunkowanie: legion III — wierzchołek SE, legion V — NE, kohorty al
      lewego skrzydła — S, prawego — N, jazda al i extraordinarii — NW lub SW). Jedna jednostka velites z każdego legionu „śpi”, pozostałe dwie są w straży
      obozu. Ale mają mało jazdy (po jednej zwykłej jednostce jazdy z każdej ali) i piechoty (bez triarii al; po 8 kohort i jednej kohorcie extraordinarii
      z każdej ali). Gracz wyznacza, która ala jest lewym, a która prawym skrzydłem. Strażników bram w chwili alarmu natychmiast umieszcza się w wolnym heksie
      namiotu velites, z dowolnym ukierunkowaniem.
    keywords: [Beneventum, rozstawienie, obóz, straż obozu, velites]
    flags: [title-specific]
    refs: [T-43, R-SC1-9]
  - id: R-SC1-3
    title: Beneventum (atak nocny) — armia epirocka poza mapą, pięć sekcji
    section: "SC1 Beneventum — The Epirote/Italian Army"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „The Epirote/Italian Army”, s. 5", pages: "5", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Na początku scenariusza **nie ma** jednostek epirockich na mapie; wszystkie wchodzą w fazie marszu podejścia. Dowódcy: Pyrrus, Aleksander, Leonnatos,
      Milon. Armia dzieli się na pięć sekcji: straż przednia, siły główne, osłona lewego skrzydła, osłona prawego skrzydła, straż tylna (skład — T-43).
    keywords: [Beneventum, Epiroci, sekcje, marsz podejścia]
    flags: [title-specific]
    refs: [T-43, R-SC1-4]
  - id: R-SC1-4
    title: Beneventum — faza marszu podejścia (Approach March Phase) — kolejność i mnożniki
    section: "SC1 Beneventum — Approach March Order"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Approach March Order”, s. 5", pages: "5", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Faza marszu podejścia poprzedza start gry (przed normalną sekwencją). Trwa, dopóki Rzymianie nie zostaną zaalarmowani albo gracz epirocki nie ogłosi
      końca. Kolejność sekcji, mnożnik początkowego marszu podejścia (IAM) i heks wejścia: 1) straż przednia 4×/3044; 2) siły główne 2×/3143, 3044 i/lub 2943
      (można dzielić); 3) osłona lewego skrzydła 2×/2644; 4) osłona prawego skrzydła 2×/3343; 5) straż tylna 1×/3044.
    keywords: [marsz podejścia, IAM, mnożnik, heks wejścia]
    flags: [title-specific]
    refs: [T-43, R-SC1-5]
  - id: R-SC1-5
    title: "Beneventum — początkowy marsz podejścia (IAM): ruch = MA × mnożnik"
    section: "SC1 Beneventum — Approach March Order"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Approach March Order”, s. 5", pages: "5", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Każda sekcja porusza się o pełny MA **razy** swój mnożnik IAM. Trafienia za teren się płaci, ale **nie** za wielokrotny ruch w tej samej turze. Przykład:
      macedońska lekka jazda straży przedniej wchodzi przez 3044 z MA 32 (8 × 4). Jeśli w dowolnym momencie Rzymianie zostaną zaalarmowani, faza marszu
      podejścia **natychmiast** się kończy i scenariusz startuje wg normalnej sekwencji gry.
    exceptions: Kara za ponowny ruch (R-6.13.1) nie obowiązuje przy wielokrotnościach marszu.
    keywords: [IAM, MA × mnożnik, alarm, koniec marszu]
    flags: [title-specific]
    refs: [R-6.13.1, R-SC1-9]
  - id: R-SC1-6
    title: "Beneventum — procedura IAM: kolejne wielokrotności, dowódcy, koszt wejścia"
    section: "SC1 Beneventum — Initial Approach March Procedure"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Initial Approach March Procedure”, s. 5", pages: "5", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Ruch jednej wielokrotności MA wykonuje cała sekcja, zanim zacznie się następną. Dowódców można umieścić z dowolną sekcją; używają mnożnika sekcji, z którą
      wchodzą. Każda wchodząca jednostka płaci koszt terenu heksu wejścia **plus** 1 MP za każdą jednostkę tej sekcji, która weszła tym samym heksem wcześniej
      (np. trzeci kreteński łucznik przez 3044: 3 MP). Gracz epirocki musi wprowadzić na mapę wszystkie jednostki — nie może żadnych wstrzymać. Gdy wszystkie
      sekcje wykonały IAM, a Rzymianie nie są zaalarmowani, może wybrać przedłużony marsz (R-SC1-8).
    exceptions: Alarm w trakcie IAM kończy cały ruch podejścia (R-SC1-5).
    keywords: [IAM, koszt wejścia, kolejka, dowódcy]
    flags: [title-specific]
    refs: [R-SC1-5, R-SC1-8]
  - id: R-SC1-7
    title: Beneventum — jednostki epirockie niewprowadzone do końca tury 1 liczą się jako wyeliminowane
    section: "SC1 Beneventum — Initial Approach March Procedure (Important)"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Important”, s. 5", pages: "5", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Jednostki epirockie, które nie weszły na mapę do końca tury 1, już nigdy nie wchodzą do gry, ale **liczą się jako wyeliminowane** przy wycofaniu armii.
    keywords: [posiłki, wyeliminowane, punkty ucieczki, tura 1]
    flags: [title-specific]
    refs: [R-11.2.1]
  - id: R-SC1-8
    title: Beneventum — przedłużony marsz podejścia i zmęczenie marszem nocnym
    section: "SC1 Beneventum — Extended Approach March"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Extended Approach March” + „Night March Fatigue Table”, s. 5–6", pages: "5-6", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    when: "po IAM, jeśli jednostki epirockie nie zostały wykryte"
    effect: |
      Gracz epirocki ogłasza, czy przedłuża marsz. Jeśli nie — scenariusz zaczyna się od tury 1. Jeśli tak — rusza sekcjami w tej samej kolejności, każda
      jednostka do **2×** MA. Po ruchu każdej sekcji (albo w chwili alarmu) rzuca **jedną kością na całą sekcję** i porównuje wynik z TQ każdej jednostki,
      która się ruszyła, wg tabeli zmęczenia marszem nocnym (T-43): ≤ TQ — bez skutku; 1–2 ponad TQ — 1 trafienie; 3+ ponad TQ — 2 trafienia. Słonie nie
      podlegają zmęczeniu. Po przedłużonym marszu (albo alarmie) zaczyna się scenariusz.
    keywords: [przedłużony marsz, zmęczenie, marsz nocny, trafienia]
    flags: [title-specific]
    refs: [T-43, R-SC1-9]
  - id: R-SC1-9
    title: Beneventum — alarm rzymski (Roman Alert)
    section: "SC1 Beneventum — Roman Alert"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Roman Alert”, s. 6", pages: "6", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Żadna jednostka rzymska nie może się ruszać ani strzelać, dopóki armia rzymska nie zostanie zaalarmowana. Alarm następuje **w chwili**, gdy jakakolwiek
      jednostka rzymska ma LOS (wg oświetlenia — R-SC1-11) do jednostki epirockiej, albo na początku tury 5 — co nastąpi pierwsze. Niezaalarmowani dowódcy
      rzymscy są traktowani jako skończeni (Rzymianie nie mogą nic robić).
    keywords: [alarm, LOS, dowódcy skończeni, tura 5]
    flags: [title-specific]
    refs: [R-SC1-11, R-5.15.1]
  - id: R-SC1-10
    title: Beneventum — kto dowodzi po alarmie
    section: "SC1 Beneventum — Roman Alert"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Roman Alert” + przykład, s. 6", pages: "6", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Alarm w fazie marszu podejścia — wszyscy dowódcy rzymscy mogą być aktywowani od początku pierwszej tury. Alarm **w trakcie** zwykłej tury — dowódcy
      rzymscy z inicjatywą niższą niż skończeni dowódcy epiroccy pozostają skończeni w tej turze; aktywni są tylko ci, którzy byliby uprawnieni do aktywacji wg
      5.12. Przykład: Leonnatos i Milon skończeni, alarm podczas rozkazu Aleksandra — uprawniony jest tylko Dentatus (inicjatywa 5), trybuni i prefekci są
      skończeni w tej turze. Po alarmie **wszystkie** jednostki rzymskie mogą otrzymywać rozkazy; LC są dozwolone wewnątrz obozu; strażników bram umieszcza się
      w namiotach velites (R-SC1-2).
    keywords: [alarm, aktywacja, inicjatywa, kolejność, LC w obozie]
    flags: [title-specific]
    refs: [R-5.12.1, R-SC1-2]
  - id: R-SC1-11
    title: Beneventum — pora dnia, linie alarmu i LOS
    section: "SC1 Beneventum — Time of Day and Line of Sight"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Time of Day and Line of Sight” + przykłady #1–#2, s. 6", pages: "6", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Trzy warunki oświetlenia: cała faza marszu podejścia — **noc**; tury 1–3 — **świt**; tura 4 i dalej — **dzień**. Na mapie są trzy linie alarmu (Night,
      Dawn, Day Alert Line). Gdy jednostka epirocka wejdzie „do środka” (bliżej obozu) linii alarmu odpowiadającej oświetleniu — zostaje wykryta i Rzymianie są
      zaalarmowani. Wyjątek: las blokuje LOS alarmu — LOS wchodzi do heksu lasu, ale nigdy przez niego. Przykład #1 (noc): 3024 → 2923 → 2823 → 2723 —
      wykryta w chwili wejścia do 2823. Przykład #2 (świt): 1114 → 1214 → 1313 — bez alarmu, drzewa blokują LOS.
    keywords: [noc, świt, dzień, linia alarmu, LOS, las]
    flags: [title-specific]
    refs: [R-SC1-9, R-8.14.1]
  - id: R-SC1-12
    title: Beneventum — przykład marszu podejścia
    section: "SC1 Beneventum — An Example of Approach March"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „An Example of Approach March”, s. 6", pages: "6", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Straż przednia wchodzi przez 3044, każda jednostka 4 × MA (jazda 32 heksy, harcownicy 24, lekka piechota 20) na południowy zachód (czołowa jazda
      ok. 1321). Siły główne wchodzą przez 2943, 3044, 3143 (2 × MA), czoło ok. 2034; osłona lewego skrzydła przez 2644 na lewo od sił głównych, prawego przez
      3343 na prawo; na końcu straż tylna przez 3044. Jednostki nigdy nie zbliżyły się na 10 heksów do Rzymian (noc), więc bez alarmu; gracz nie przedłuża
      marszu — start wg normalnej sekwencji.
    notes: "[wniosek] Przykład sugeruje, że nocna linia alarmu leży ok. 10 heksów od jednostek rzymskich; o wykryciu decyduje jednak linia na mapie (R-SC1-11)."
    keywords: [marsz podejścia, przykład, linia alarmu]
    flags: [title-specific, summary]
    refs: [R-SC1-4, R-SC1-11]
  - id: R-SC1-13
    title: Beneventum — wariant swobodnego rozstawienia (Free Set-Up)
    section: "SC1 Beneventum — The Meeting Engagement / Free Set-Up Scenario"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Free Set-Up Scenario”, s. 6", pages: "6", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Bitwa ustawiona: najpierw cała armia rzymska w dowolnych heksach **xx18 i na zachód** (włącznie; można w obozie), potem armia epirocka w dowolnych heksach
      **xx31 i na wschód** (włącznie). Zasady marszu podejścia się pomija; jest dzień; pozostałe zasady obowiązują.
    keywords: [swobodne rozstawienie, bitwa ustawiona, xx18, xx31]
    flags: [title-specific]
    refs: [R-SC1-1, N-44]
  - id: R-SC1-14
    title: Beneventum — karta uprawnień do LC i specjalna linia wyjścia z obozu
    section: "SC1 Beneventum — Line Command Eligibility"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Line Command Eligibility”, s. 6", pages: "6", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Linie wg T-29 (Beneventum). Linie oznaczone „*” nie muszą przylegać (w księdze „see 4.24” — w 5. ed. 4.32). Linia rzymska nr 6 („**”: velites, jazda,
      AS/CE) służy do **wychodzenia z obozu**; gdy wszyscy dowódcy rzymscy są poza obozem, nie można jej używać jako linii. Triarii nie mają „*” (por. nota
      historyczna 4.32).
    keywords: [LC, karta uprawnień, linia wyjścia z obozu, triarii]
    flags: [title-specific]
    refs: [T-29, R-4.32.1, N-23]
  - id: R-SC1-15
    title: "Beneventum — obóz rzymski: teren specjalny i poziom 2"
    section: "SC1 Beneventum — The Roman Camp"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „The Roman Camp”, s. 7", pages: "7", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Obóz ma specjalne efekty terenu wg karty „Roman Camp Terrain Effects” (T-35): bramy, rów/wał (berm), wieże, kwatery. Bramy nie mają „drzwi” — wejście
      blokuje zapora pokazana na mapie. Cały obóz jest na **poziomie 2** — tym samym co wzgórze, na którym stoi.
    keywords: [obóz rzymski, brama, rów, wał, wieża, poziom 2]
    flags: [title-specific]
    refs: [T-35, R-6.24.2]
  - id: R-SC1-16
    title: "Beneventum — wyjście z obozu: bramy przez 5 tur i LC bez rzutu w obozie"
    section: "SC1 Beneventum — Exiting the Camp"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Exiting the Camp”, s. 7", pages: "7", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Przez pierwsze **5 tur** po alarmie jednostki rzymskie w obozie mogą wychodzić tylko wyznaczonymi bramami (T-43): legiony III i V — Porta Decumana; kohorty
      al lewego skrzydła — Porta Principis Sinistra; prawego — Porta Principis Dextra; wszystkie pozostałe oprócz straży obozu — Porta Praetoria; straż obozu —
      dowolna brama. Po 5. turze ograniczenie znika. Ponadto **każdy dowódca rzymski w obozie** może wydać LC bez rzutu na strategię.
    keywords: [wyjście z obozu, bramy, 5 tur, LC bez rzutu]
    flags: [title-specific]
    refs: [T-43, R-4.33.3]
  - id: R-SC1-17
    title: Beneventum — skorpiony obozowe
    section: "SC1 Beneventum — Camp Scorpios"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Camp Scorpios”, s. 7", pages: "7", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Skorpiony są częścią umocnień obozu: **nie mają TQ, typu, Size ani MA** — tylko zasięg. Strzelają wg 9.84–9.86, ale heks skorpiona musi być zajęty przez
      własną jednostkę piechoty. Skorpiony **nie otrzymują trafień**. Gdy jednostka epirocka wejdzie do heksu wieży, skorpion jest automatycznie wyeliminowany.
      Skorpiony są warte **0 RP** (R-SC1-24).
    keywords: [skorpion, obóz, wieża, bez TQ, bez trafień]
    flags: [title-specific]
    refs: [R-9.81.1, R-9.82.1, R-9.84.1, R-9.85.1, R-9.86.1, R-9.87.1, R-SC1-24]
  - id: R-SC1-18
    title: "Beneventum — wieże: limit stosu i premie ostrzału"
    section: "SC1 Beneventum — Towers"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Towers”, s. 7", pages: "7", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      W heksie wieży może być najwyżej jedna jednostka piechoty i jeden skorpion. Rzymska piechota zdolna do ostrzału w wieży: **–1 DRM** do ostrzału na
      normalnych zasięgach; może strzelać na zasięg o 1 większy od maksymalnego — wtedy trafia tylko wynik „0” (bez DRM za wieżę).
    keywords: [wieża, ostrzał, –1 DRM, zasięg +1]
    flags: [title-specific]
    refs: [T-35, R-8.15.1, R-8.16.1]
  - id: R-SC1-19
    title: "(opcja) Beneventum — pociski zapalające skorpionów"
    section: "SC1 Beneventum — The Scorpion's Fiery Sting (Optional)"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „The Scorpion’s Fiery Sting…” (Benefits/Drawbacks), s. 7", pages: "7", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Każdy skorpion można przestawić na pociski zapalające samą deklaracją gracza rzymskiego. **Korzyść:** trafienie słonia pociskiem zapalającym = automatyczna
      ucieczka (i szał); na inne jednostki działa jak zwykłe trafienie. **Wady:** zasięg –1 (najwyżej 6 heksów) i +1 do rzutu poza zasięgiem 1 i 2 heksów.
      Raz rozpoczęty ostrzał zapalający z wieży nie może być przerwany. Jeśli piechota w wieży używającej pocisków zapalających ucieka — jednostka zostaje
      wyeliminowana, a heks jest odtąd płonący: nikt nie może do niego wejść do końca scenariusza; wymuszone wejście eliminuje jednostkę.
    notes: "Wiersz „Scorpio (Flame)” w MRRC (T-22) ma już niższe wartości od zasięgu 3 i brak zasięgu 7 — czy dodawać jeszcze +1 DRM, zob. N-43."
    keywords: [skorpion, pociski zapalające, słoń, szał, płonąca wieża]
    flags: [title-specific, optional]
    refs: [T-22, R-9.14.1, N-43]
  - id: R-SC1-20
    title: "(opcja) Beneventum — płonące świnie"
    section: "SC1 Beneventum — Roman Flaming Pigs (Optional)"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Roman Flaming Pigs…” + „The Flaming Pig Table”, s. 7, 10", pages: "7, 10", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Dwa razy w grze gracz rzymski może zamiast rozkazu indywidualnego rzucić na tabeli płonących świń (T-43); liczy się to jako rozkaz indywidualny.
      0 — słoń wyznaczony rzutem atakuje najbliższą jednostkę bojową (rzymską lub epirocką) wprost przed swoim frontem (kilka celów — rzut; dalej niż 4 heksy —
      bez skutku); 1–7 — bez skutku; 8 — +1 trafienie dowolnemu jednemu słoniowi; 9 — dowolny jeden słoń: rzut, trafienia = DR – TQ, co najmniej 1.
    keywords: [płonące świnie, słonie, rozkaz indywidualny]
    flags: [title-specific, optional]
    refs: [T-43, R-4.22.1]
  - id: R-SC1-21
    title: Beneventum — doktryna triarii od wyjścia z obozu
    section: "SC1 Beneventum — Triarii Doctrine"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Triarii Doctrine”, s. 10", pages: "10", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: Doktryna triarii (9.7) obowiązuje od chwili, gdy Rzymianie opuścili obóz i sformowali linie.
    notes: "[wniosek] Do tego momentu triarii nie podlegają 9.71–9.72. Księga nie precyzuje, kiedy linie są „sformowane”."
    keywords: [doktryna triarii, obóz]
    flags: [title-specific]
    refs: [R-9.7.1, R-9.71.1, R-9.72.1]
  - id: R-SC1-22
    title: Beneventum — krawędzie odwrotu
    section: "SC1 Beneventum — Retreat Edges"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Retreat Edges”, s. 10", pages: "10", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: Epiroci — wschodnia krawędź mapy; Rzymianie — zachodnia.
    keywords: [krawędź odwrotu]
    flags: [title-specific]
    refs: [R-10.22.1]
  - id: R-SC1-23
    title: Beneventum — warunki zwycięstwa
    section: "SC1 Beneventum — Victory"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Victory”, s. 10", pages: "10", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Gra trwa, dopóki: a) Epiroci mają **co najmniej 5 jednostek bojowych w obozie** i w obozie nie ma żadnej rzymskiej jednostki bojowej — Epiroci wygrywają
      automatycznie; ALBO b) od tury **10** wszystkie nieuciekające jednostki rzymskie są w obozie — jeśli Rzymianin wycofa wszystkie jednostki do obozu,
      przegrywa; ALBO c) jedna armia się wycofuje: Rzymianie przy **120** RP, Epiroci przy **100** RP.
    keywords: [zwycięstwo, obóz, próg wycofania, "120", "100"]
    flags: [title-specific]
    refs: [T-42, R-11.2.2]
  - id: R-SC1-24
    title: Beneventum — punkty ucieczki Pyrrusa i skorpionów
    section: "SC1 Beneventum — Victory"
    source: {text: "księga scen. 2018 (4. ed.), Beneventum „Victory”, s. 10", pages: "10", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: Ranny Pyrrus jest wart **25 RP**; jeśli zginie — wygrywa gracz rzymski. Skorpiony są warte **0 RP**.
    keywords: [Pyrrus, ranny, zabity, punkty ucieczki, skorpion 0 RP]
    flags: [title-specific]
    refs: [R-11.1.1, T-23]
  # --- SC2: Bagradas, 255 p.n.e. (s. 8–10) ---
  - id: R-SC2-1
    title: Bagradas — mapa, poziom trudności, wyważenie
    section: "SC2 Bagradas — General Information"
    source: {text: "księga scen. 2018 (4. ed.), Bagradas „General Information”, s. 8–9", pages: "8-9", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Mapa Zamy albo Kann; teren można całkowicie pominąć. Scenariusz zalecany na pierwszą grę („najłatwiejsza” bitwa, ok. 2 godz.). Wyważenie mocno sprzyja
      Kartagińczykom; poza licytacją RP jako poprawka zasad — dać Rzymianom całą jazdę al (R-SC2-7).
    keywords: [Bagradas, mapa, wyważenie, nauka gry]
    flags: [title-specific]
    refs: [R-SC0-1, R-SC2-7]
  - id: R-SC2-2
    title: Bagradas — dowodzenie kartagińskie bez 4.6 i bez dowódców zastępczych
    section: "SC2 Bagradas — Carthaginian Army under Xanthippus"
    source: {text: "księga scen. 2018 (4. ed.), Bagradas „Carthaginian Army under Xanthippus”, s. 9", pages: "9", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Wszystkie jednostki kartagińskie twarzą na SE (rozstawienie — T-44). **Nie stosuje się 4.6** — dowódcy podlegli zależą od Ksantypposa przy LC (4.33).
      Gracz kartagiński **nie może** używać dowódców zastępczych.
    notes: "[wniosek] 4.6 i tak dotyczy tylko bitew z Hannibalem jako OC — zapis potwierdza, że Ksantyppos nie ma tej zdolności."
    keywords: [Ksantyppos, "4.6", dowódcy zastępczy, LC]
    flags: [title-specific]
    refs: [T-44, R-4.6.1, R-4.74.1, R-4.33.3]
  - id: R-SC2-3
    title: Bagradas — armia rzymska bez jazdy al, manipuły w „podwójnej głębokości”
    section: "SC2 Bagradas — The Roman Army under M. Atilius Regulus"
    source: {text: "księga scen. 2018 (4. ed.), Bagradas „The Roman Army…”, s. 9", pages: "9", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Wszystkie jednostki rzymskie twarzą na NW. Pełna armia konsularna **bez jazdy al**; legiony/ale III i V (standardowe). Regulus ustawił manipuły „w podwójnej
      głębokości” zamiast w rozciągniętej linii, więc jednostki **nie zaczynają w stosach**. Dowódcy: Regulus — dowolnie; 2 trybunów i 2 prefektów
      sprzymierzeńców — po jednym z każdą osobną linią HA/PR, z dowolną jednostką piechoty lub obok niej; 2 prefektów jazdy — 2808, 2833. Rozstawienie — T-44.
    notes: "„Double depth” jest tu opisowe (głębokie ugrupowanie manipułów), a nie formacją falangi z 9.5 — N-23."
    keywords: [Regulus, rozstawienie, bez jazdy al, bez stosów]
    flags: [title-specific]
    refs: [T-44, N-23, R-9.51.1]
  - id: R-SC2-4
    title: Bagradas — karta uprawnień do LC
    section: "SC2 Bagradas — Line Command Eligibility"
    source: {text: "księga scen. 2018 (4. ed.), Bagradas „Line Command Eligibility”, s. 9", pages: "9", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: |
      Linie wg T-29 (Bagradas). „*” — linia nie musi przylegać (w księdze „see 4.24”; w 5. ed. 4.32). Triarii (linia 4) bez „*” — muszą przylegać.
    notes: "Nota historyczna 4.32 sugeruje, że pod Bagradas Rzymianie „dostosowali” linię triarii — karta tego nie odzwierciedla (N-38)."
    keywords: [LC, karta uprawnień, triarii]
    flags: [title-specific]
    refs: [T-29, R-4.32.1, N-23, N-38]
  - id: R-SC2-5
    title: Bagradas — doktryna triarii obowiązuje
    section: "SC2 Bagradas — Triarii Doctrine"
    source: {text: "księga scen. 2018 (4. ed.), Bagradas „Triarii Doctrine”, s. 10", pages: "10", document: "docs/scen_book/SPQR-Scenario-Book-2018-5.pdf"}
    effect: Doktryna triarii (9.7) obowiązuje w tym scenariuszu.
    keywords: [doktryna triarii]
    flags: [title-specific]
    refs: [R-9.7.1]
  - id: R-SC2-6
