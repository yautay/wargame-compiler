chapter: {id: "2", title: "2.0 Komponenty i terminologia (Game Components and Terminology)"}
rules:
  - id: R-2.0.1
    title: Zawartość pudełka
    section: "2.0"
    source: {text: "oryg. 2.0, s. 2", pages: "2"}
    effect: |
      Sześć dwustronnych arkuszy map 22″×34″; sześć arkuszy żetonów (½″, 280 żetonów na pełnym arkuszu); instrukcja; trzy księgi
      scenariuszy (I – The Rise of Rome, II – The 2nd Punic War, III – Macedonia, Syria, and Africa); cztery karty pomocy 11″×17″
      (PAC I i PAC II, dwustronne, po dwa identyczne egzemplarze); karta toru punktów ucieczki / tury 8½″×11″; jedna kość
      dziesięciościenna; woreczki na żetony.
    notes: |
      [wniosek] Tabele, do których odsyła instrukcja (ruch, stos, ostrzał, przewaga, starcie, CRT walki wręcz, trafienia/testy TQ,
      reorganizacja), są wydrukowane na kartach PAC — nie ma ich w źródłach projektu (zob. N-01, T-20…T-28).
    keywords: [komponenty, PAC, karty pomocy, kość k10]
    refs: [N-01, T-20, T-21, T-22, T-23, T-24, T-25, T-26, T-27, T-28]
  - id: R-2.1.1
    title: Mapy — dwie bitwy na arkuszu, siatka heksów
    section: "2.1"
    source: {text: "oryg. 2.1 „The Maps”, s. 2", pages: "2"}
    effect: |
      Każdą bitwę rozgrywa się na mapie 22″×34″; arkusze są zadrukowane dwustronnie (dwa pola bitew na arkusz). Siatka heksów
      reguluje ruch i walkę; wpływ terenu opisują zasady i tabele.
    keywords: [mapa, heks, teren]
  - id: R-2.2.1
    title: Trzy rodzaje żetonów
    section: "2.2"
    source: {text: "oryg. 2.2 „The Playing Pieces”, s. 2", pages: "2"}
    effect: |
      Żetony dzielą się na: **jednostki bojowe** (oddziały wojsk), **dowódców** (osoby dowodzące wojskami) i **znaczniki
      informacyjne** (zapis stanu gry).
    keywords: [żetony, jednostka bojowa, dowódca, znacznik]
  - id: R-2.21.1
    title: Jednostki kwadratowe i prostokątne (falanga)
    section: "2.21"
    source: {text: "oryg. 2.21, s. 2", pages: "2"}
    effect: |
      Jednostki bojowe mają dwa rozmiary: kwadratowe i prostokątne. Prostokątne to sztywny szyk falangi w stylu macedońskim
      (część ciężkiej piechoty); zajmują dwa heksy (zob. R-2.5.2).
    keywords: [falanga, żeton prostokątny, rozmiar żetonu]
    refs: [R-2.5.2]
  - id: R-2.21.2
    title: Parametry jednostki bojowej — Size, TQ, ruch, wskaźnik broni miotanej
    section: "2.21"
    source: {text: "oryg. 2.21, s. 2", pages: "2"}
    effect: |
      Każda jednostka bojowa ma określony typ (wg uzbrojenia i opancerzenia) oraz wartości: **Size** (liczebność), **TQ** (Troop
      Quality, jakość wojska) i zdolność ruchu (MA). Jednostki zdolne do ostrzału mają **wskaźnik broni miotanej**: A = łuk
      (arrow), J = oszczep (javelin), S = proca (stone). Zasięgi tych broni podaje Tabela ostrzału (Missile Table).
    keywords: [Size, TQ, MA, broń miotana, A, J, S]
    refs: [T-22]
  - id: R-2.21.3
    title: Rewers żetonu = jednostka osłabiona
    section: "2.21"
    source: {text: "oryg. 2.21, s. 2", pages: "2"}
    effect: |
      Jednostka bojowa ma dwie strony. Odwrócenie na rewers oznacza, że jest **osłabiona** (Depleted, 10.3).
    keywords: [osłabiona, rewers, Depleted]
    see: R-10.31.1, R-10.31.1
    refs: [R-10.31.1, R-10.31.1]
  - id: R-2.22.1
    title: Typ i klasa jednostki
    section: "2.22"
    source: {text: "oryg. 2.22, s. 2; 2.4 „Class”, „Type”, s. 3–4", pages: "2-4"}
    effect: |
      Każda jednostka ma **typ** (np. HI, LC), który służy do ustalania wyników i skuteczności walki wobec innych typów. Wiele typów
      dzieli się na **klasy**, np. klasa HO typu HI (ciężka piechota w stylu hoplitów) albo klasa HA typu LG (hastati, piechota
      legionowa).
    keywords: [typ, klasa, HI, LG, HO, HA]
  - id: R-2.23.1
    title: Legiony i ale — oznaczenia i poziomy wyszkolenia
    section: "2.23"
    source: {text: "oryg. 2.23 „The Legions”, s. 2–3", pages: "2-3"}
    effect: |
      Gra zawiera osiem pełnych legionów rzymskich z odpowiadającymi im alae sociorum; numery nie są historyczne względem
      bitew. Poziomy wyszkolenia: elitarny (Crack/Elite) — I Legion; weteranów — X Legion/Ala, I Ala; standardowy — III, V
      Legiony/Ale; rekruci — VII, XIV, XV, XIX Legiony/Ale. Nie ma elitarnych al.
    keywords: [legion, ala, wyszkolenie, weterani, rekruci]
  - id: R-2.23.2
    title: Oznaczenia legionów na żetonach i kolor obramowania
    section: "2.23"
    source: {text: "oryg. 2.23, s. 3", pages: "3"}
    effect: |
      Jednostki legionu mają nadrukowany numer legionu (np. III); jednostki alae sociorum — „AS” i numer (np. AS/XIX). Legion
      i odpowiadająca mu ala mają wspólny, indywidualny kolor obramowania, co ułatwia stosowanie rzymskich zasad stosu.
    keywords: [kolor obramowania, AS, stos rzymski]
    see: R-9.63.1
    refs: [R-9.63.1]
  - id: R-2.24.1
    title: Jednostki legionu — uzbrojenie w okresie przejściowym (komentarz)
    section: "2.24"
    source: {text: "oryg. 2.24 „Legion Units”, s. 3", pages: "3"}
    effect: |
      Komentarz projektantów: legion był w okresie przejściowym (część principes z pilami, część z włóczniami; jazda rzymska
      między lekką a ciężką). Mieszanka żetonów odzwierciedla najbardziej prawdopodobne typy; gracze mogą ją dostosować.
    keywords: [principes, pila, jazda rzymska]
    flags: [summary]
  - id: R-2.2.2
    title: Parametry dowódców (zapowiedź 4.1)
    section: "2.2"
    source: {text: "oryg. 2.2 akapit „Leaders” (po 2.24), s. 3", pages: "3"}
    effect: Dowódcy mają parametry opisujące inicjatywę i zdolności dowodzenia; opisuje je 4.1.
    see: R-4.1.1
    keywords: [dowódca, parametry]
    flags: [summary]
    refs: [R-4.1.1]
  - id: R-2.2.3
    title: Znaczniki informacyjne
    section: "2.2"
    source: {text: "oryg. 2.2 akapit „Informational Markers” (po 2.24), s. 3", pages: "3"}
    effect: |
      Znaczniki (np. SHOCK MUST CHECK TQ, liczbowe „#” = trafienia, ROUTED TQ=1, MISSILE LOW) zapisują stan gry, jak opisano
      w dalszych zasadach.
    keywords: [znaczniki, trafienia, MISSILE LOW, ROUTED]
  - id: R-2.25.1
    title: Przykładowe żetony jednostek — rozmieszczenie parametrów
    section: "2.25"
    source: {text: "oryg. 2.25 „Examples of Combat Units” (ramka z ilustracjami), s. 3", pages: "3"}
    effect: |
      Ramka pokazuje żetony: **falanga** (podwójna) — nazwa/ID, typ, Size, TQ, MA oraz rozszerzony MA (Extended Movement
      Allowance); **piechota** i **jazda** — nazwa/ID, klasa, rodzaj broni miotanej, typ, MA, TQ, Size; **skorpion** — typ
      i zasięg; **słoń** — osłona łuczników (Archer Screen) i rodzaj broni miotanej; ponadto przykłady: wielbłąd, łucznik,
      rydwan, dowódca, słoń dowódcy (Elephant Leader).
    keywords: [żeton, rozszerzony MA, osłona łuczników, skorpion]
    see: R-6.41.1, R-9.12.1, R-9.81.1
    refs: [R-6.41.1, R-9.12.1, R-9.81.1]
  - id: R-2.3.1
    title: Tabele i kość k10 — „0” to zero
    section: "2.3"
    source: {text: "oryg. 2.3 „Charts, Tables and the Die”, s. 3", pages: "3"}
    effect: |
      Użycie każdej tabeli wyjaśniają zasady. Gra używa kości dziesięciościennej; wynik **0 traktuje się jako 0** (nie 10).
    keywords: [k10, kość, zero, tabele]
    refs: [T-01]
  - id: R-2.4.1
    title: Dowódca aktywny — tylko jeden naraz
    section: "2.4"
    source: {text: "oryg. 2.4 „Active Leader”, s. 3", pages: "3"}
    effect: Dowódca aktywny to ten, który w danej chwili wydaje rozkazy. **W danym momencie aktywny może być tylko jeden dowódca.**
    keywords: [dowódca aktywny, aktywacja]
  - id: R-2.4.2
    title: Spójność i trafienia
    section: "2.4"
    source: {text: "oryg. 2.4 „Cohesion”, „Depletion”, s. 3", pages: "3"}
    effect: |
      **Spójność** (Cohesion) to zdolność jednostki do utrzymania zorganizowanego szyku bojowego; mierzy się ją trafieniami
      (Cohesion Hits, w skrócie Hit/Hits). **Osłabienie** (Depletion) to utrata ludzi nieznacznie obniżająca skuteczność jednostki.
    keywords: [spójność, trafienie, osłabienie]
    see: R-10.1.1, R-10.31.1
    refs: [R-10.1.1, R-10.31.1]
  - id: R-2.4.3
    title: DR, DRM, MA, MP
    section: "2.4"
    source: {text: "oryg. 2.4 „DR”, „DRM”, „MA”, „MP”, s. 3–4", pages: "3-4"}
    effect: |
      DR — rzut kością; DRM — modyfikator rzutu; MA — podstawowy limit punktów ruchu jednostki (odzwierciedla też jej
      manewrowość względem innych jednostek); MP — punkt ruchu.
    keywords: [DR, DRM, MA, MP]
  - id: R-2.4.4
    title: Dowódca skończony i nieaktywny
    section: "2.4"
    source: {text: "oryg. 2.4 „Finished Leader”, „Inactive Leader”, s. 4", pages: "4"}
    effect: |
      **Skończony** (Finished) — dowódca, który był już aktywowany w tej turze i (zwykle) nie może być aktywowany ponownie;
      dowódca może też zostać skończony z innych powodów, np. nieudanego przejęcia (Trump). **Nieaktywny** (Inactive) — dowódca
      jeszcze nieaktywowany i nadal uprawniony do aktywacji.
    keywords: [skończony, nieaktywny, Finished, Inactive]
    see: R-5.15.1
    refs: [R-5.15.1]
  - id: R-2.4.5
    title: Dowódca = Commander
    section: "2.4"
    source: {text: "oryg. 2.4 „Leader”, s. 4", pages: "4"}
    effect: Słowa „Leader” i „Commander” są w instrukcji zamienne (dowódca).
    keywords: [dowódca, Commander]
  - id: R-2.4.6
    title: Linia — definicja z karty uprawnień do rozkazów liniowych
    section: "2.4"
    source: {text: "oryg. 2.4 „Line”, s. 4", pages: "4"}
    effect: |
      **Linia** to wszystkie jednostki wymienione na karcie uprawnień do rozkazów liniowych (Line Command Eligibility chart) danej
      bitwy jako uprawnione do ruchu w ramach jednego rozkazu liniowego.
    keywords: [linia, Line Command Eligibility]
    see: R-4.32.1, R-4.33.1
    refs: [R-4.32.1, R-4.33.1]
  - id: R-2.4.7
    title: Rozkazy indywidualne i liniowe — „orders” obejmuje oba
    section: "2.4"
    source: {text: "oryg. 2.4 „Order/Line Command”, s. 4; 5.0 „IMPORTANT”, s. 11", pages: "4,11"}
    effect: |
      Dowódca ma dwa sposoby kierowania wojskiem: **rozkazy indywidualne** (IO) dla pojedynczych jednostek i **rozkazy liniowe**
      (LC) dla całych linii. Uprawnienie do IO i do LC ocenia się **osobno**. Słowo „orders” oznacza zarówno rozkaz liniowy, jak
      i rozkazy indywidualne.
    keywords: [rozkaz indywidualny, rozkaz liniowy, IO, LC, orders]
    see: R-5.0.1
    refs: [R-5.0.1]
  - id: R-2.4.8
    title: Ostrzał, impet (Momentum), przejęcie (Trump), faza rozkazów
    section: "2.4"
    source: {text: "oryg. 2.4 „Missile Fire”, „Momentum”, „Orders Phase”, „Trump”, s. 4", pages: "4"}
    effect: |
      **Ostrzał** — rzucanie oszczepami, strzelanie z łuków i proc do jednostek wroga. **Impet** (Momentum) — mechanizm
      pozwalający dowódcy przeprowadzić więcej niż jedną fazę rozkazów w turze. **Faza rozkazów** — okres, w którym dowódca
      wydaje rozkazy ruchu i walki. **Przejęcie** (Trump) — mechanizm, którym dowódca wroga zatrzymuje fazę rozkazów dowódcy
      przeciwnika i przejmuje ją; może też służyć własnemu dowódcy do wyprzedzenia innego, niżej ocenianego własnego dowódcy.
    keywords: [ostrzał, impet, Momentum, przejęcie, Trump, faza rozkazów]
    see: R-5.31.1, R-5.41.1
    refs: [R-5.31.1, R-5.41.1]
  - id: R-2.4.9
    title: Walka wręcz (Shock Combat), Size, przewaga
    section: "2.4"
    source: {text: "oryg. 2.4 „Shock Combat”, „Size”, „Superiority”, s. 4", pages: "4"}
    effect: |
      **Walka wręcz** (Shock Combat) — starcie bezpośrednie. **Size** — liczba ludzi w jednostce; Size harcowników (niezmiennie 1)
      nie oznacza liczebności, tylko rozproszony szyk, w którym liczebność nie wpływa na siłę. **Przewaga** (Superiority) —
      względna skuteczność systemów uzbrojenia/opancerzenia, wzmocniona wyszkoleniem i doświadczeniem (dla kohort); osiągnięta
      przewaga znacznie zwiększa straty spójności przeciwnika.
    keywords: [walka wręcz, Size, przewaga, Superiority, harcownik]
    see: R-8.45.1, R-8.46.1
    refs: [R-8.45.1, R-8.46.1]
  - id: R-2.4.10
    title: TQ — najważniejszy parametr
    section: "2.4"
    source: {text: "oryg. 2.4 „TQ”, s. 4", pages: "4"}
    effect: |
      TQ (Troop Quality) to najważniejsza wartość jednostki bojowej; sprawdza się ją zawsze, gdy jednostka robi coś, co zagraża
      jej spójności. Kiedy używa się TQ, podsumowuje Tabela trafień i testów TQ (Cohesion Hit and TQ Check Chart, 8.75).
    keywords: [TQ, test TQ, spójność]
    see: R-8.75.1, R-10.11.1
    refs: [R-8.75.1, R-10.11.1, T-28]
  - id: R-2.4.11
    title: Strefa kontroli — definicja ogólna
    section: "2.4"
    source: {text: "oryg. 2.4 „Zone of Control (ZOC)”, s. 4", pages: "4"}
    effect: |
      Strefa kontroli (ZOC) to heksy — zwykle bezpośrednio przed frontem jednostki — na które jednostka wywiera „wpływ”
      utrudniający swobodę ruchu.
    keywords: [strefa kontroli, ZOC]
    see: R-7.2.1, R-7.21.1
    refs: [R-7.2.1, R-7.21.1]
  - id: R-2.4.12
    title: Opisy rodzajów wojsk (komentarz historyczny)
    section: "2.4"
    source: {text: "oryg. 2.4 druga część („Consular Army” … „Scorpio”), s. 4–6", pages: "4-6"}
    effect: |
      Słowniczek opisuje armię konsularną, legion, velites, hastati, principes, triarii, alae sociorum, manipuły, ciężką piechotę,
      falangę, piechotę legionową (LG — miecz zamiast włóczni, większa tarcza), piechotę średnią (np. celtycką), piechotę barbarzyńską,
      lekką piechotę (zwykle z bronią miotaną, inna taktyka niż harcownicy), harcowników (oszczepnicy, łucznicy, procarze), lekką
      i ciężką jazdę, lansjerów, jazdę rzymską, słonie i skorpiony. Treść jest historyczna; reguły z niej wynikające wydzielono
      w R-2.4.13…R-2.4.15.
    keywords: [typy jednostek, velites, hastati, principes, triarii, ala]
    flags: [summary]
    refs: [R-2.4.13, R-2.4.14, R-2.4.15]
  - id: R-2.4.13
    title: W grze nie ma harcowników-oszczepników
    section: "2.4"
    source: {text: "oryg. 2.4 „Javelinists”, s. 5", pages: "5"}
    effect: W tej epoce czystych harcowników z oszczepami było niewielu, dlatego **w grze nie ma harcowników-oszczepników**.
    keywords: [oszczepnicy, harcownik, javelin]
  - id: R-2.4.14
    title: Lansjerzy nie mają zdolności ostrzału
    section: "2.4"
    source: {text: "oryg. 2.4 „Lancers”, s. 6", pages: "6"}
    effect: Lansjerzy to lekka jazda szkolona do ataku lancą; **nie mają zdolności ostrzału** (uproszczenie na potrzeby gry).
    keywords: [lansjerzy, LN, broń miotana]
  - id: R-2.4.15
    title: Jazda rzymska — osobny wiersz przewagi, w starciu jak HC
    section: "2.4"
    source: {text: "oryg. 2.4 „Roman Cavalry”, s. 6", pages: "6"}
    effect: |
      Jazda rzymska (także z al) ma osobne oznaczenie i **osobny wiersz w Tabeli przewagi** (Shock Superiority Chart), ale
      w Tabeli starcia włóczni i mieczy (Clash of Spears and Swords Chart) **traktuje się ją jak ciężką jazdę (HC)**.
    keywords: [jazda rzymska, RC, HC, przewaga, starcie]
    see: R-8.45.1, R-8.72.1, R-8.73.1
    refs: [R-8.45.1, R-8.72.1, R-8.73.1, T-24, T-25]
  - id: R-2.5.1
    title: Skala — heks, tura, punkt Size
    section: "2.5"
    source: {text: "oryg. 2.5 „Game Scale”, s. 6", pages: "6"}
    effect: |
      Heks ≈ 70+ kroków (jardów) między bokami; tura ≈ 20 minut. Punkt Size = 100–150 piechurów (zależnie od szyku i głębokości)
      lub 100 jeźdźców; jednostka piechoty legionu ≈ 2–3 manipuły. Wyjątek: Size harcowników odzwierciedla rozproszony szyk,
      nie liczebność. Size to najmniej ważny parametr jednostki.
    keywords: [skala, heks, tura, Size]
    refs: [T-02]
  - id: R-2.5.2
    title: Kształt żetonu = front; falanga zajmuje 2 heksy
    section: "2.5"
    source: {text: "oryg. 2.5, s. 6", pages: "6"}
    effect: Kształt żetonu odpowiada frontowi oddziału. Falanga w pełnym szyku (front ok. 150 jardów) zajmuje **2 heksy**; jednostka jazdy (ok. 50+ jardów) — 1 heks.
    keywords: [front, falanga, 2 heksy]
    refs: [T-02]
  - id: R-2.6.1
    title: Długość gry — do wycofania się armii
    section: "2.6"
    source: {text: "oryg. 2.6 „Game Length”, s. 6", pages: "6"}
    effect: |
      Bitwy toczą się zwykle do wycofania się jednej z armii, więc liczenie tur zwykle nie jest potrzebne. Tor tur służy do
      odmierzania zdarzeń w niektórych bitwach (np. wejścia posiłków).
    keywords: [długość gry, tor tur, posiłki]
    see: R-11.2.1
    refs: [R-11.2.1]
  - id: R-2.7.1
    title: Łacina (bez skutków w grze)
    section: "2.7"
    source: {text: "oryg. 2.7 „Latin”, s. 6", pages: "6"}
    effect: Autorzy używają łacińskich terminów wojskowych tam, gdzie to stosowne. Sekcja nie zawiera zasad.
    keywords: [łacina]
    flags: [summary]
