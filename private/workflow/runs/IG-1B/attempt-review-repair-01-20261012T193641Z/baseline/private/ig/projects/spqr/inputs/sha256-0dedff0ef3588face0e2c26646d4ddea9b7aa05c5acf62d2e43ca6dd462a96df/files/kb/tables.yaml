          - ["D. Ucieczka i przeładowanie", "1. zdejmij znaczniki RALLIED; 2. ruch ucieczki (10.23); 3. przeładowanie (8.18); 4. odwróć skończonych dowódców, zdejmij MOVED, FIRED, PURSUIT/FINISHED, TRUMPED"]
          - ["E. Wycofanie", "każdy gracz sumuje RP wyeliminowanych jednostek bojowych i dowódców; jeśli żadna armia się nie wycofuje — następna tura"]
