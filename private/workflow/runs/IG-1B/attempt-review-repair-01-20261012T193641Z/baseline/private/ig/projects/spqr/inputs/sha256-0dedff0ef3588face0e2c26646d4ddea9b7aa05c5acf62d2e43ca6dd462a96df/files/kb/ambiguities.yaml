  - id: N-20
    group: Zwycięstwo
    title: Remis przy obustronnym przekroczeniu progu — równe sumy czy równe nadwyżki
    scope: original
    quotes: "11.2: „the player with the least number of RP above that level wins (but just barely). If both sides’ RP totals are the same, it’s a draw.”"
    readings: "A — remis przy równych nadwyżkach ponad próg. B — remis tylko przy równych sumach RP (nadwyżki mogą się różnić)."
    recommendation: "A — zdanie rozstrzyga remis w kryterium z poprzedniego zdania."
