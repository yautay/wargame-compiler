  - id: N-69
    group: Instrukcja 5. ed.
    title: "Jednostki związane walką — „their MA” (10.42) i „advances” (10.43)"
    scope: original
    quotes: |
      10.42: „engaged with units whose MA is less than their MA”; 10.43: „advances”.
    description: |
      10.42: „engaged with units whose MA is less than their MA”: drugie „their” może dotyczyć jednostek jazdy, harcowników lub piechoty lekkiej (przyjęto:
        porównanie MA jednostek związanych, „niż ich własny”). 10.43: „advances” w kroku załamania nie nazwano mechanizmem; przełożono jako pościg po walce
        (8.5).
    readings: |
      (10.42) A — MA jednostek związanych walką wobec ich własnego; B — wobec MA przeciwników.
    recommendation: |
      A — jedyne rozsądne porównanie (R-10.42.1). 10.43 — pościg po walce.
    strength: probable
