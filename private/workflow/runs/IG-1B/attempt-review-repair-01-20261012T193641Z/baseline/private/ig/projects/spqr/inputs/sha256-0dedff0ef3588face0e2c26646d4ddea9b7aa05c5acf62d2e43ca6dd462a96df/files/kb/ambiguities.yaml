ambiguities:
  - id: N-01
    group: Źródła
    title: "Tabele z kart pomocy (PAC) i karty uprawnień do LC — źródła częściowe (karty sprzed 5. ed., księga scenariuszy 4. ed.)"
    scope: original
    quotes: |
      2.0: „Four 11” x 17” player aid cards, PAC I and PAC II”; 2.3: „The use of each chart and table is explained in the rules”; 6.63: „all given on the
      two Stacking Charts”; 8.46: „(all listed on the Shock CRT)”. Karty z docs/update: „4.53 Leader Casualties”, „8.56 Cohesion Hit and TQ Charts”;
      księga: „SPQR 4th Edition Scenario Book … © 2018 GMT Games”.
    description: |
      Do 2026-10-04 wartości tabel były tylko na kartach PAC spoza źródeł. Teraz `wgu.yaml` ma `sources.charts` (34 obrazy w docs/update) i `sources.scenarios`
      (księga scenariuszy 4. ed., 2018). T-20…T-29 przepisano z obrazów i księgi (complete: true), dodano T-31…T-48 (m.in. tabele rzutu zagłady, szału, testów
      dowódców, obozu rzymskiego, Trebii/Metaurusa, scenariuszy). Wszystkie liczbowe przykłady instrukcji zgadzają się z kartami (kontrole krzyżowe w T-20…T-28).
      Pozostaje: część kart ma numerację i treść sprzed 5. ed. (N-24…N-35); część obrazów to pomoce nieoficjalne (N-36); księga scenariuszy jest z 4. ed. (N-23)
      i obejmuje tylko 5 bitew i scenariusz szkoleniowy; brak scenariuszy/kart LC dla bitew wspomnianych w 5. ed. (Trebia i Metaurus — jest tylko karta terenu
      T-36; Sentinum i Telamon — 9.96). Największa luka dla digitalizacji: tabele rozstawienia (T-43…T-48) podają ID jednostek i heksy, ale w źródłach nie ma
      parametrów żetonów (Size, TQ, MA, klasa, broń) ani map (teren heksów, linie alarmu i obóz pod Beneventum, kompas szału i Volturnus) — OOB nie jest
      samowystarczalne.
    readings: |
      A — karty z docs/update odpowiadają kartom PAC 5. ed. poza wskazanymi różnicami; wartości niepodane w tekście (CRT, Clash, przewaga, MRRC) przyjmuje się
      z kart.
      B — karty pochodzą w całości z wcześniejszej edycji; wartości mogą różnić się także tam, gdzie tekst 5. ed. ich nie podaje.
    recommendation: |
      A dla wartości niepodanych w tekście (brak lepszego źródła; zgodność wszystkich przykładów liczbowych), z pierwszeństwem tekstu 5. ed. przy rozbieżnościach
      (R-1.0.2). Gdy będą dostępne — porównać ze skanami PAC I/II 5. ed. i księgami scenariuszy 5. ed.
    strength: probable
    resolution_source: Karty PAC I/II SPQR Deluxe (5th Ed.), księgi scenariuszy 5. ed.
    impact: Nie blokuje już ruchu, ostrzału ani walki wręcz; ryzyko — drobne różnice 4./5. ed. w wartościach niepodanych w tekście; brak części scenariuszy.
    resolution: |
      Częściowo rozwiązane 2026-10-04 (aktualizacja przyrostowa): T-20…T-29 complete: true; nowe T-31…T-48; scenariusze księgi 2018 w kb/rules/12-…
      Otwarte: pochodzenie kart (4./5. ed.), brak ksiąg scenariuszy 5. ed. i scenariuszy Trebii, Metaurusa, Sentinum, Telamonu; brak parametrów żetonów
      (Size, TQ, MA) i map — rozstawienia T-43…T-48 bez tych danych nie wystarczą do digitalizacji.
    status: open
    refs: [T-20, T-21, T-22, T-23, T-24, T-25, T-26, T-27, T-28, T-29, T-36, R-2.0.1, R-6.27.1, R-6.69.1, R-8.71.1, R-8.72.1, R-8.73.1, R-8.74.1, R-8.75.1, R-10.29.1, R-4.73.1, R-1.0.2, R-9.96.1, N-23, N-24, N-36, T-31, T-48, N-35, T-43]
  - id: N-02
    group: Dowodzenie i aktywacja
    title: Rozkaz liniowy dowódcy podległego w fazie impetu — kiedy rzut i co znaczy „nie zrobił tego”
    scope: original
    quotes: |
      4.33: „A Subordinate Commander may issue a Line Command in a Momentum-generated Orders Phase only if the player rolls against the OC’s Strategy
      Rating per #2 above. The leader cannot issue a Line Command if he did not do so in his Initial Orders Phase.” „Exception #1: In the first Game Turn only…”
    readings: |
      (a) Rzut: A — zawsze wymagany w fazie impetu, także w zasięgu OC; B — tylko poza zasięgiem OC (jak pkt 2).
      (b) Pierwsza tura: A — wyjątek #1 dotyczy tylko fazy początkowej; B — także faz impetu w 1. turze.
      (c) „did not do so”: A — dowódca nie wydał LC w fazie początkowej (z wyboru lub z braku uprawnień) → brak LC w impecie; B — tylko gdy nie miał uprawnienia.
      (d) +1 DRM za strefę kontroli: stosuje się (odesłanie „per #2”).
    recommendation: |
      (a) A, (b) A, (c) A, (d) tak — tekst mówi „only if the player rolls”, a wyjątek #1 stoi w akapicie o fazie początkowej. Potwierdza to karta Command
      Summary (T-34): „Momentum Orders Phase: Issue a Line Command only if he issued one in the Initial Orders Phase and the player’s DR ≤ his OC’s Strategy
      Rating”; „it is the first Game Turn of the scenario” stoi tylko przy „Initial Orders Phase”. Status otwarty, bo karta pochodzi sprzed 5. ed. (N-24).
    strength: certain
    resolution_source: FAQ/errata GMT lub ConsimWorld (seria GBoH); karta T-34.
    status: open
    refs: [R-4.33.3, R-4.33.4, R-4.33.5, T-34, N-24]
  - id: N-03
    group: Dowodzenie i aktywacja
    title: Armia bez dowódcy naczelnego (OC poległ, brak prokonsula)
    scope: original
    quotes: "4.75: „If an Overall Commander is eliminated, he is not replaced; no other leader takes over.”"
    description: |
      Wiele zasad zakłada istnienie OC: LC dowódców podległych (zasięg OC / rzut ≤ strategia OC), zastępowanie dowódców (IO od OC), ruch dowódców ze stref
      kontroli (IO od OC), przegrupowanie jazdy spoza mapy (faza OC), PW (warunek OC ≥ 6), EIO (elitarny OC), formowanie DD (rozkaz OC).
    readings: |
      A — po śmierci OC wszystkie te możliwości znikają (np. LC dowódców podległych tylko w 1. turze/na mocy wyjątków; brak zastępstw, powrotu jazdy, DD).
      B — rzut na strategię z wartością 0 (LC tylko przy wyniku 0).
    recommendation: "A — 4.75 mówi wprost, że nikt nie przejmuje dowództwa; brak OC = brak uprawnień OC."
    strength: speculative
    resolution_source: FAQ/errata GMT.
    status: open
    refs: [R-4.75.1, R-4.33.3, R-4.74.1, R-4.24.1, R-8.64.1, R-6.81.1, R-5.51.1, R-9.51.1]
  - id: N-04
    group: Dowodzenie i aktywacja
    title: Odskok dowódcy — co znaczy „otherwise adjacent”
    scope: original
    quotes: |
      4.72: „The instant an enemy combat unit moves adjacent… to a friendly leader that is not already in an enemy ZOC, that friendly leader may immediately
      withdraw…” „A leader that is otherwise adjacent to an enemy combat unit cannot withdraw and is eliminated if that combat units enters its hex”.
    readings: |
      A — „otherwise” = dowódca sąsiadujący z wrogiem w inny sposób niż przez właśnie wykonany ruch wroga (np. już stał obok, poza strefą kontroli) — nie odskakuje.
      B — „otherwise” = dowódcy nieobjęci pierwszym zdaniem (czyli już w strefie kontroli wroga); dowódca stojący obok wroga poza jego strefą kontroli może
      odskoczyć, gdy podchodzi kolejna jednostka.
    recommendation: "B — pierwsze zdanie wprost wyłącza tylko dowódców „already in an enemy ZOC”."
    strength: probable
    status: open
    refs: [R-4.72.1, R-4.72.4]
  - id: N-05
    group: Dowodzenie i aktywacja
    title: (opcja 4.9) Dowodzenie słoniami — zakres „pierwszego razu” i rodzaj rozkazów
    scope: original
    quotes: "4.91: „The first time in a battle that Elephant units are given orders, they do so normally. However, after that there are only two ways of giving IOs/LCs to move Elephant units”."
    readings: |
      (a) A — pierwszy raz dla całej armii (pierwsza faza z rozkazami dla słoni); B — pierwszy raz dla każdej jednostki słoni.
      (b) A — ograniczenie dotyczy tylko rozkazów ruchu (ostrzał, odzyskanie spójności, reorganizacja słoni — normalnie); B — wszystkich rozkazów.
    recommendation: "(a) A, (b) A — tekst mówi „to move Elephant units”."
    strength: speculative
    status: open
    refs: [R-4.91.1, R-4.92.1]
  - id: N-06
    group: Dowodzenie i aktywacja
    title: Ponowna aktywacja (rzut zagłady) — impet i dalsza kolejność
    scope: original
    quotes: |
      5.33: „a Finished leader that is re-activated may not use Momentum himself.” 5.34: „You may not apply Momentum to a leader… who was Reactivated (5.33).”
    readings: |
      (a) A — żaden ponownie aktywowany dowódca nie używa impetu (5.34); B — tylko ponownie aktywowany dowódca skończony (5.33).
      (b) Po fazie ponownie aktywowanego dowódcy: A — powrót do kolejności od najniższej inicjatywy (jak 5.42); B — inna kolejność (brak zapisu).
    recommendation: "(a) A — 5.34 jest zasadą ogólną; karta rzutu zagłady (T-31): „Such a Re-Activated leader may not use Momentum himself” (bez zawężenia do skończonych); (b) A — przez analogię do 5.42 (wniosek)."
    strength: probable
    status: open
    refs: [R-5.33.1, R-5.34.1, R-5.42.3, T-31]
  - id: N-07
    group: Ruch i wycofania
    title: Kara za ponowny ruch (6.13) — który wcześniejszy ruch się liczy
    scope: original
    quotes: |
      6.13: „If a combat unit that moved in a previous Orders Phase moves again… This hit penalty only applies to units ordered to Move (5.22 #1 or 5.23 #1);
      it does not apply to any other type of movement.” 6.54: „For the purposes of Movement Allowances (6.1), no movement points are expended”.
    readings: |
      A — wcześniejszy ruch dowolnego rodzaju (OW, posunięcie, pościg, ucieczka) + obecny ruch na rozkaz → 1 trafienie.
      B — oba ruchy muszą być ruchami na rozkaz (znacznik MOVED); OW, posunięcie, pościg nie liczą się jako „moved”.
    recommendation: |
      B — 6.54 stanowi, że OW nie liczy się dla 6.1 (6.13 należy do 6.1); znaczniki MOVED służą ruchom na rozkaz. H&D liczy się jako ruch (8.33) i i tak wymaga
      rozkazu ruchu.
    strength: probable
    resolution_source: FAQ/errata GMT; próba tłumaczenia 2026-10-04 wskazała tę samą niejasność. Karta 8.56 (T-28) mówi o „“Moved” Unit moves again” — cudzysłów wskazuje znacznik MOVED (wspiera B).
    status: open
    refs: [R-6.13.1, R-6.54.1, R-8.33.1, T-28]
  - id: N-08
    group: Ruch i wycofania
    title: Falanga po ruchu — kara z 6.41 a kara z 6.13
    scope: original
    quotes: "6.41: „If a “Moved” Phalanx uses its 5 MA in any subsequent move, it incurs 2 Cohesion Hits (there is no TQ check) or 1 Cohesion Hit if it uses its 4 MA.”"
    readings: "A — 6.41 zastępuje 6.13 dla falang (razem 2 albo 1 trafienie). B — kumulacja z 6.13 (3 albo 2 trafienia)."
    recommendation: "A — wariant „4 MA = 1 trafienie” powtarza dokładnie 6.13, więc 6.41 opisuje łączną karę. Karta 8.56 (T-28) podaje osobne pozycje: „“Moved” Unit moves again — 1” i „“Moved” Phalanx moves again using 5 MA — 2” (wspiera A)."
    strength: probable
    status: open
    refs: [R-6.41.2, R-6.13.1, T-28]
  - id: N-09
    group: Ruch i wycofania
    title: PW — co znaczy „have the capability to do so (6.51)”
    scope: original
    quotes: |
      6.8: „allows certain units to withdraw… even though they do not have a higher MA.” 6.83: „if the units in the the line (with PW) have the capability to do so (6.51)”.
    readings: |
      A — chodzi o pozostałe warunki OW (nie w strefie kontroli wroga, nie uciekające, nie w kolumnie, dozwolony heks), bez różnicy MA.
      B — wymagana też przewaga MA (sprzeczne z celem PW).
    recommendation: "A — inaczej PW nie miałoby sensu (wstęp 6.8)."
    strength: probable
    status: open
    refs: [R-6.83.1, R-6.8.1, R-6.51.1]
  - id: N-10
    group: Ruch i wycofania
    title: PW — kiedy „tactic is employed” ogranicza impet OC
    scope: original
    quotes: "6.81: „If the tactic is employed, that side’s OC is limited to one Momentum attempt that Game Turn, not two (5.14).”"
    readings: |
      A — ograniczenie wchodzi, gdy na początku tury wyznaczono prawdziwe PW (znacznik stroną PW, nie NO PW), nawet jeśli nie zostało użyte.
      B — tylko gdy PW zostało faktycznie wykonane (wtedy ograniczenie może zadziałać dopiero po fakcie).
      Dodatkowo: dotyczy wyłącznie OC (nie innych dowódców) — tekst wymienia tylko OC.
    recommendation: "A — ograniczenie musi być znane, zanim OC próbuje impetu; ograniczenie tylko dla OC."
    strength: speculative
    status: open
    refs: [R-6.81.2, R-6.82.1, R-5.14.1]
  - id: N-11
    group: Dowodzenie i aktywacja
    title: Impet — „was previously in an enemy ZOC”
    scope: original
    quotes: "5.31: „The leader is in an enemy ZOC, or was previously in an enemy ZOC (5.26).”"
    readings: |
      A — dowolny pobyt w strefie kontroli wroga wcześniej w tej turze (np. OC wyszedł z niej własnym IO) wyklucza impet.
      B — tylko dowódcy z 5.26 (zaczęli fazę początkową w strefie kontroli i czekali) — odesłanie w nawiasie.
    recommendation: "B — nawias (5.26) wskazuje przypadek aktywacji odroczonej; ale dowódca będący w strefie kontroli na koniec fazy i tak nie ma impetu."
    strength: probable
    status: open
    refs: [R-5.31.1, R-5.26.2]
  - id: N-12
    group: Ruch i wycofania
    title: Zmiana ukierunkowania w reakcji — znak różnicy MA i minimum 1 trafienia
    scope: original
    quotes: |
      7.15: „modifies that DR by the +/– difference between the MA of the moving unit and the MA of the stationary unit. If the DR is higher than the unit’s TQ,
      that unit incurs Cohesion Hits equal to the difference, with a minimum of 1 Cohesion Hit, regardless of the DR.”
      6.44 (to samo zdanie o minimum) i ex-6.44-1 (TQ 6): „if the DR were, say, a 5, the phalanx would incur another 1 cohesion hit”; 9.16: „with a minimum result of 1 cohesion hit”.
    readings: |
      (a) DRM = MA poruszającego się − MA stojącego (szybszy wróg pogarsza test) — A; odwrotnie — B.
      (b) „minimum 1… regardless of the DR”: A — zawsze co najmniej 1 trafienie; B — minimum dotyczy tylko nieudanego testu.
    recommendation: |
      (a) A — kolejność wyrazów w zdaniu; (b) A — identyczne sformułowanie w 6.44 ma przykład z wynikiem ≤ TQ dającym 1 trafienie. Karta 8.56 (T-28) potwierdza
      oba: „Cohesion Hits equal to DR minus TQ minimum 1” i [c] „adding the difference between the MA of the moving unit and the MA of the reacting unit”.
      Inne różnice tej pozycji karty („foot only”, „Phallanx 2”) — N-26.
    strength: certain
    status: open
    refs: [R-7.15.1, R-7.16.1, R-6.44.1, T-28, N-26]
  - id: N-13
    group: Walka
    title: „Lekka” jednostka, która przy ruchu nie zadeklarowała ataku
    scope: original
    quotes: |
      7.32 (przykład): „the moving player must state his decision on whether to do so as it finishes movement.” Play Note po 7.33: „you cannot place a SHOCK NO
      TQ CHECK on a “light’ unit that chose not to Shock when it moved; it gets a SHOCK MUST CHECK TQ.”
    readings: |
      A — decyzja przy ruchu jest wiążąca: jednostka nie atakuje w tym segmencie; nota tylko zakazuje „zamiany” na NO TQ CHECK.
      B — jednostka może jednak zaatakować później, ale ze znacznikiem SHOCK MUST CHECK TQ (test przed walką).
    recommendation: "A dla zakazu NO TQ CHECK (pewne); możliwość późniejszego ataku — niepewna, rekomendacja A (7.32 jest zasadą, nota — komentarzem)."
    strength: speculative
    status: open
    refs: [R-7.32.1, R-7.33.1, R-7.33.4]
  - id: N-14
    group: Walka
    title: (opcja 8.66) Znak modyfikatora charyzmy i skrót „BC”
    scope: original
    quotes: "8.66: „RC/HC/BC: 3” … „+/– Charisma Rating of any one leader involved.”"
    readings: |
      Charyzma: A — właściciel wybiera znak (chce lub nie chce pościgu); B — zawsze odejmowana (kontrola dowódcy, por. nota historyczna 8.6); C — zawsze dodawana.
      BC: skrót nieobjaśniony w instrukcji (prawdopodobnie typ jazdy z innego tytułu serii).
    recommendation: "Charyzma — A (sformułowanie „+/–”); BC — traktować jak HC do czasu wyjaśnienia."
    strength: speculative
    status: open
    refs: [R-8.66.1]
  - id: N-15
    group: Walka
    title: H&D jazdy w bok/tył słonia — kto otrzymuje 2 trafienia
    scope: original
    quotes: "8.34: „A cavalry’s H&D attack through a Flank/Rear hex earns 2 Cohesion Hits that are applied prior to any Missile Fire.”"
    readings: "A — trafienia otrzymuje jazda (jak w 9.15 za wejście w heksy boczne/tylne słonia). B — trafienia otrzymuje słoń."
    recommendation: "A — zdanie odwołuje się do ograniczeń 9.15, a kara jest „przed ostrzałem”. Karta 8.56 (T-28), trafienia automatyczne: „Cavalry moves or uses H&D fire into an Elephant Flank/Rear hex — 2 Cohesion Hits” — trafienia otrzymuje jazda."
    strength: certain
    status: open
    refs: [R-8.34.1, R-9.15.1, T-28]
  - id: N-16
    group: Jednostki specjalne
    title: Czy uciekający słoń dowódcy zawsze wpada w szał
    scope: original
    quotes: "9.14: „Leader Elephants also Rampage, but they have less of a chance of doing so.” 4.84: „If the DR is a 7–9, the elephant… Rampages”."
    readings: |
      A — każda ucieczka słonia dowódcy = szał wg tabeli 9.14 („mniejsza szansa” = wynik 0 eliminuje, 7–9 w kolejnym rzucie reorganizuje); 4.84 to dodatkowy wyzwalacz.
      B — słoń dowódcy wpada w szał tylko po śmierci dowódcy (4.84, 7–9).
    recommendation: "A — 9.14 zaczyna się od „When an Elephant unit routs, it Rampages” i wymienia skutki dla słonia dowódcy."
    strength: probable
    status: open
    refs: [R-9.14.1, R-4.84.1]
  - id: N-17
    group: Jednostki specjalne
    title: Triarii — „cannot move and Shock attack” a obowiązek walki 7.31
    scope: original
    quotes: "9.72: „Triarii units cannot move and Shock attack unless and until… They may always, however, Shock attack (without moving)…”"
    readings: |
      A — triarii nie mogą wejść obok wroga (bo 7.31 wymusiłby atak).
      B — mogą wejść obok, ale nie atakują w tym segmencie (9.72 uchyla 7.31); w następnej fazie mogą zaatakować z miejsca.
    recommendation: "A — B tworzy obejście (podejście bez ataku, potem atak bez ruchu) sprzeczne z intencją doktryny."
    strength: speculative
    status: open
    refs: [R-9.72.1, R-7.31.1, R-9.71.1]
  - id: N-18
    group: Struktura instrukcji
    title: Brak reguły 9.92 w numeracji
    scope: original
    quotes: "s. 36: po „9.91 Movement Effects” następuje „9.93 Rout and Recovery”."
    readings: "A — luka redakcyjna, bez utraconej treści. B — reguła pominięta przy redakcji 5. edycji."
    recommendation: "A; sprawdzić w 4. edycji (brak w źródłach projektu). ID w bazie zachowują numerację oryginału (brak rekordów dla 9.92)."
    strength: probable
    resolution_source: SPQR 4th Ed. / living rules.
    status: open
    refs: [R-9.91.1, R-9.93.1]
