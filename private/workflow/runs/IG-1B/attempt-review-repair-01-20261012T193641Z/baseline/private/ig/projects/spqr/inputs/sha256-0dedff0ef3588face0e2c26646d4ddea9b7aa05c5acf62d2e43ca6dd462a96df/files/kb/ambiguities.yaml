    readings: "A — brak wyzwalacza (ani wejście w zasięg 2, ani start w odległości 2). B — wyzwalacz, bo wróg jest „within 2 hexes”."
    recommendation: "A — literalnie wyzwalaczem jest wejście w zasięg albo start dokładnie w 2 heksach."
