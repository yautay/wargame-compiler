  sense: Tabela zbiorcza momentów, w których jednostka otrzymuje trafienia lub wykonuje test TQ (SPQR 8.75).
  pl: Tabela trafień i testów TQ
  pl_forms:
  - Tabela trafień i testów TQ
  - Tabeli trafień i testów TQ
  - Tabelę trafień i testów TQ
  notation:
    component_text: Nazwa tabeli na arkuszu pomocy pozostaje angielska, jeśli arkusz nie jest tłumaczony. Wtedy przy pierwszym użyciu podaj nazwę
      oryginalną
  status: approved
  decided_by: user
  overrides: gboh.cohesion-tq-chart
  rationale: 'Zatwierdzone przez właściciela 2026-10-05 (17 pojęć z warstw współdzielonych w obecnym brzmieniu). Dowody z PL3 w oryginale warstwy
