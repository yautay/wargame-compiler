  - typami
  - typach
  notation:
    first_use: typ jednostki\ang{Type}
    component_text: Skróty typów (HI, LG, LI, SK…) zostają jak wydrukowano na żetonach i tabelach.
  rejected:
  - pl: rodzaj jednostki
    reason: kolizja z potocznym „rodzaj”, nie oddaje relacji typ–klasa
  - pl: rodzaj wojsk
    reason: terminologia współczesna (NATO)
  related:
  - spqr.unit-class
  status: approved
  decided_by: user
  rationale: „Typ” jest neutralnym, ugruntowanym słowem; samo „typ” wolno po pierwszym użyciu w podrozdziale. Rodzaj wojsk (NATO) nie pasuje do
    armii antycznych.
