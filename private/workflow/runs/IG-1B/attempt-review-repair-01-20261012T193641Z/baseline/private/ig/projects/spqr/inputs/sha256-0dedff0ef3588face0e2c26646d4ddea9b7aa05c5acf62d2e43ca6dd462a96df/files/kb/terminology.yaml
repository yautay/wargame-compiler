  sense: 'Skrzydła sprzymierzeńców: oddziały italskich sprzymierzeńców Rzymu, po dwie ala na armię konsularną, odpowiadające legionom; na żetonach
    z napisem AS i numerem (AS/XIX).'
  disambiguation: AS w tym znaczeniu = żeton ala sprzymierzeńców (np. AS/XIX), NIE Attack Superiority (przewaga ataku, 8.46).
  rules:
  - SPQR-2.23
