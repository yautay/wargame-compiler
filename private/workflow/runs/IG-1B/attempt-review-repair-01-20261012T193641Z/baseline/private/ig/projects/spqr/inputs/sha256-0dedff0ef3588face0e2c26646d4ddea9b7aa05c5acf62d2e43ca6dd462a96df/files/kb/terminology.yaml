  - rampaging Elephant
  - rampages
  sense: 'Szczególna ucieczka słonia. Zamiast ruchu ucieczki (10.22) po uciekającym słoniu rzuca się kością po kolei na kierunek: 0 do najbliższej
    jednostki własnej (słoń dowódcy ginie), 1–6 w kierunku wskazanym na róży wiatrów mapy, 7–9 za pierwszym razem od jednostki, która wywołała
    szał, a potem słoń ginie (słoń dowódcy zostaje zreorganizowany). Za każdym rzutem 3 heksy. Szał rozstrzyga się natychmiast i w całości; nie
    ma ZOC, nie wywołuje ostrzału reakcyjnego, nie podlega reorganizacji; wolno tylko uporządkowane wycofanie (6.51) (SPQR 9.14).'
  disambiguation: Nie zwykły ruch ucieczki (spqr.rout-move). „Rampage” dotyczy tylko słoni; wyliczone kolizje z jednostkami, śmierć dowódcy w
    stosie itd. są częścią tego pojęcia.
