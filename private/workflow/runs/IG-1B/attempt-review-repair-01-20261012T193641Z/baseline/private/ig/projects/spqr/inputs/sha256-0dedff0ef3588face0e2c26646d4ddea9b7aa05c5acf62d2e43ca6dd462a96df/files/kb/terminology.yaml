  - size
  sense: 'Parametr jednostki bojowej: liczba ludzi, wyrażona w punktach (1 pkt = 100–150 piechoty lub 100 jazdy); sumowana w walce wręcz. U harcowników
    zawsze 1 i oznacza rozproszenie, nie liczbę ludzi.'
  disambiguation: Tylko parametr jednostki (Size). Rozmiar (kwadrat/prostokąt) żetonu opisuj opisowo.
  rules:
