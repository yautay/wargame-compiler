  - Harassment and Dispersal
  - H&D
  - H&D fire
  - H&D Fire
  sense: Ostrzał lekkich jednostek (harcownicy i lekka piechota z pociskami przeciw jednostkom o takim samym lub niższym limicie MA, lekka jazda
    przeciw niższemu), w którym jednostka podchodzi do celu i wraca bez przesuwania żetonu. Wymaga rozkazu ruchu, jest ruchem dla modyfikatorów
    ostrzału i zużywa cały limit punktów ruchu. Zasięg 2 heksy (piechota) lub 4 (jazda), nie w heksie sąsiednim i nie w strefie kontroli wroga;
    ostrzał rozstrzyga się jak z zasięgu 1.
