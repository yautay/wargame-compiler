  notation:
    first_use: \textit{alae sociorum}\ang{Alae Sociorum, AS}
    component_text: Oznaczenie „AS/XIX” jak wydrukowano.
    capitalisation: nazwa łacińska, kursywa, małą literą
    typography: \textit{}, nieodmienne; jednostka \textit{ala} (l.mn. \textit{alae}) — forma pojedyncza do potwierdzenia przez właściciela
  rejected:
  - pl: ale sprzymierzeńców
    reason: wersja analityka (odmienne „ale”) sprzeczna z decyzją o nieodmienności i kolizyjna z „ale” jako spójnikiem
  related:
  - spqr.legion
  - spqr.consular-army
  status: approved
  decided_by: user
  rationale: 'Decyzja właściciela: alae sociorum łacińskie, kursywą, nieodmienne. Pojedyncze „ala” i „alae” traktuję tak samo (propozycja).'
  evidence:
  - source: SPQR-EN5
    where: rule 2.23
    supports: sense
  notes: 'Odmiana: brak (nieodmienne); w pl_forms tylko formy łacińskie. Orchestrator: potwierdzić zapis liczby pojedynczej „ala”.'
