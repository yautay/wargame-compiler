  variants:
  - TQ rating
  - TQ
  - Troop Quality
  - printed TQ
  sense: Wydrukowany parametr jakości jednostki. Jest progiem testów TQ i limitem trafień.
  disambiguation: Parametr (wartość). Test to osobne pojęcie gboh.tq-check.
  rules:
  - SPQR-2.21
  - SPQR-10.11
  pl: wartość TQ
  pl_forms:
  - wartość TQ
  - wartości TQ
  - wartością TQ
  pl_abbrev: TQ
  notation:
    first_use: jakość wojska (TQ)\ang{Troop Quality}
  related:
  - gboh.tq-check
  status: approved
  decided_by: user
  rationale: 'Zatwierdzone przez właściciela 2026-10-05 (17 pojęć z warstw współdzielonych w obecnym brzmieniu). Dowody z PL3 w oryginale warstwy
    nie stanowią uzasadnienia (decyzja: PL3 ignorowane).'
  evidence: []
  overrides: gboh.tq-rating
- id: spqr.ov-tq-check
  source_term: TQ Check
  variants:
  - TQ check
  - TQ checks
  - TQ Checks
  sense: Rzut kością porównywany z wartością TQ. Wynik wyższy od wartości daje trafienia według tabeli.
  rules:
  - SPQR-10.11
  pl: test TQ
  pl_forms:
  - test TQ
  - testu TQ
  - teście TQ
  - testem TQ
  - testy TQ
  - testów TQ
  - testach TQ
  - testom TQ
  related:
  - gboh.tq-rating
  rejected:
  - pl: rzut na TQ
    reason: wariant PL3 s. 29; jedno pojęcie = jeden termin
  status: approved
  decided_by: user
  evidence: []
  overrides: gboh.tq-check
  rationale: 'Zatwierdzone przez właściciela 2026-10-05 (17 pojęć z warstw współdzielonych w obecnym brzmieniu). Dowody z PL3 w oryginale warstwy
    nie stanowią uzasadnienia (decyzja: PL3 ignorowane).'
- id: spqr.ov-rout
  source_term: Rout
  variants:
  - routs
  - Routed
  - routed
  - routing
  - Routing
  - rout
  sense: Stan i ruch jednostki, która utraciła spójność (trafienia ≥ TQ). Ucieka w Segmencie Ucieczki i jest uwzględniana w punktach ucieczki.
  disambiguation: Nie mylić z uporządkowanym wycofaniem (Orderly Withdrawal) ani z wycofaniem armii (Army Withdrawal).
  rules:
  - SPQR-10.2
  - SPQR-10.14
  pl: ucieczka
  pl_forms:
  - ucieczka
  - ucieczki
  - ucieczce
  - ucieczkę
  - ucieczką
  - ucieka
  - uciekają
  - uciekać
  - uciekająca
  - uciekającej
  - uciekającą
  - uciekające
  - uciekających
  related:
  - gboh.orderly-withdrawal
  rejected:
  - pl: rozbicie
    reason: „rozbić” = pokonać przeciwnika; inny sens
  status: approved
  decided_by: user
  rationale: 'Zatwierdzone przez właściciela 2026-10-05 (17 pojęć z warstw współdzielonych w obecnym brzmieniu). Dowody z PL3 w oryginale warstwy
    nie stanowią uzasadnienia (decyzja: PL3 ignorowane).'
  evidence: []
  overrides: gboh.rout
