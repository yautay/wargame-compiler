- id: spqr.counter
  source_term: counter
  variants:
  - counters
  - playing piece
  - playing pieces
  sense: Płaski element gry (jednostka bojowa, dowódca albo znacznik informacyjny) kładziony na planszy.
  rules:
  - SPQR-2.2
  pl: żeton
  pl_forms:
  - żeton
  - żetonu
  - żetonowi
  - żeton
  - żetonem
  - żetonie
  - żetony
  - żetonów
  - żetonom
  - żetony
  - żetonami
  - żetonach
  rejected:
  - pl: pionek
    reason: sugeruje figurkę; w grach wojennych żeton to standard
  - pl: licznik
    reason: kalka (counter) i inne znaczenie
  related:
  - spqr.information-marker
  status: approved
  decided_by: user
  rationale: Ugruntowane słowo polskich gier planszowych; „pionek” odrzucony jako zbyt ogólny. Do włączenia do warstwy wspólnej.
  evidence:
  - source: SPQR-EN5
    where: rule 2.2
    supports: sense
