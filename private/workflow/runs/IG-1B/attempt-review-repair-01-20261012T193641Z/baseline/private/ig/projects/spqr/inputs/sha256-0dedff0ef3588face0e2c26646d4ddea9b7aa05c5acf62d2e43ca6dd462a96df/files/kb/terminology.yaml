- id: spqr.ov-command-range
  source_term: Command Range
  variants:
  - command range
  sense: Parametr dowódcy — odległość w heksach, w jakiej jednostki mogą otrzymać jego rozkazy (ścieżka bez wrogich jednostek i ZOC).
  disambiguation: Nie zasięg ostrzału (Missile Range). PL3 używa samego „Zasięg” w obu znaczeniach.
  rules:
  - SPQR-4.21
  pl: zasięg dowodzenia
  pl_forms:
  - zasięg dowodzenia
  - zasięgu dowodzenia
  - zasięgiem dowodzenia
  rejected:
  - pl: zasięg
    reason: 'PL3: to samo słowo dla zasięgu dowodzenia i ostrzału; w przepisach zawsze pełna nazwa'
  status: approved
  decided_by: user
  evidence:
  - source: GCACW-PL
    where: §6 (Command radius)
    form: zasięg dowodzenia
    supports: usage-in-games
  overrides: gboh.command-range
  rationale: 'Zatwierdzone przez właściciela 2026-10-05 (17 pojęć z warstw współdzielonych w obecnym brzmieniu). Dowody z PL3 w oryginale warstwy
    nie stanowią uzasadnienia (decyzja: PL3 ignorowane).'
