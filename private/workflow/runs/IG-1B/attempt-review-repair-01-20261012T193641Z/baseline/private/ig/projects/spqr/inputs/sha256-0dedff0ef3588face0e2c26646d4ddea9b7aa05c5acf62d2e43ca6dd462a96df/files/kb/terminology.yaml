- id: spqr.unit-type
  source_term: Type
  variants:
  - Type
  - type
  - types
  sense: Ogólna kategoria jednostki bojowej (HI, LG, LI, SK, LC, HC, PH, BI, MI, RC, LN, EL…), decydująca o skuteczności i wynikach walki i o
    stosowaniu szczególnych przepisów.
  disambiguation: W 2.4 „Type” jest nazwą kategorii. Zwykłe „type” (np. type of missile, terrain type) to nie ten termin. Nie mylić z klasą (Class),
    podkategorią typu.
  rules:
  - SPQR-2.22
  - SPQR-2.4
  pl: typ jednostki
  pl_forms:
