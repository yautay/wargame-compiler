  - {en: "Missile Fire / missile unit", pl: "ostrzał / jednostka strzelająca", kind: technical, definition: "Rzucanie oszczepami, strzelanie z łuków, proc i skorpionów.", defined_at: "2.4, 8.1", used_in: "passim", refs: [R-8.11.1]}
  - {en: "MISSILE LOW / MISSILE NO", pl: "MISSILE LOW / MISSILE NO (znaczniki)", kind: technical, definition: "Jeden strzał zapasu / brak pocisków.", defined_at: "8.17", used_in: "7.21, 8.18, 10.27, 10.28", refs: [R-8.17.1, R-8.17.2]}
  - {en: "Missile Range and Results Chart (MRRC)", pl: "Tabela zasięgu i wyników ostrzału", kind: technical, definition: "Karta PAC: siła na zasięgach i modyfikatory ostrzału.", defined_at: "8.15, 8.71", used_in: "2.21, 9.12, 9.96", refs: [R-8.71.1, T-22]}
  - {en: "Momentum", pl: "impet", kind: technical, definition: "Rzut (≤ inicjatywa) dający temu samemu dowódcy kolejną fazę rozkazów (najwyżej dwie).", defined_at: "2.4, 5.3", used_in: "5.14, 5.42, 6.81, 9.95", refs: [R-5.31.1, R-5.32.1]}
  - {en: "Mounted Archers", pl: "konni łucznicy", kind: technical, definition: "Jedyne jednostki strzelające w trakcie uporządkowanego wycofania (łucznicy lekkiej jazdy).", defined_at: "6.55", used_in: "8.12, 9.31", refs: [R-6.55.2]}
  - {en: "MOVED marker / „Moved”", pl: "znacznik MOVED / „po ruchu”", kind: technical, definition: "Pomocniczy znacznik jednostki, która już się ruszała w turze (6.13, 6.41).", defined_at: "6.13", used_in: "6.41, 3.0 D", refs: [R-6.13.1, R-6.41.2]}
