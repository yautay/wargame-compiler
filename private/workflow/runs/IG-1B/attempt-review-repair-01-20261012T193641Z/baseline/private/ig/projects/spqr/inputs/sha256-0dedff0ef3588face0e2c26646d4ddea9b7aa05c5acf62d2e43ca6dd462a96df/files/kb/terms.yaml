notes: |
  Polskie odpowiedniki: terminy zatwierdzone przez właściciela (warstwy `common`, `series/gboh`: heks, krawędź heksu, strefa kontroli, modyfikator rzutu,
  stos, tura, faza rozkazów, limit punktów ruchu, reorganizacja, osłabiona, harcownik, uporządkowane wycofanie) oraz propozycje warstwy `series/gboh`
  (dowódca, rozkaz liniowy/indywidualny, linia, jednostka bojowa, punkt ruchu, spójność, trafienie, wartość TQ, test TQ, ucieczka, zasięg dowodzenia,
  odzyskanie spójności). Pozostałe odpowiedniki to robocze propozycje analityka do decyzji w `/wgu:tlumaczenie` — nie są zatwierdzone.
  Pole `defined_at` = reguła definiująca; `used_in` = główne miejsca użycia.
terms:
  - {en: "Active Leader", pl: "dowódca aktywny", kind: technical, definition: "Dowódca wydający w danej chwili rozkazy; aktywny może być tylko jeden.", defined_at: "2.4", used_in: "3.0, 5.1", refs: [R-2.4.1]}
  - {en: "Activated / Finished (leader counter sides)", pl: "strona aktywna / strona skończona", kind: technical, definition: "Dwie strony żetonu dowódcy; po zakończeniu aktywacji żeton odwraca się na Finished.", defined_at: "4.0", used_in: "4.22, 5.15, 3.0 D", refs: [R-4.0.2, R-4.22.2]}
  - {en: "Advance after Combat", pl: "posunięcie się po walce", kind: technical, definition: "Obowiązkowe wejście atakujących do heksów opuszczonych przez obrońców po walce wręcz; bez rozkazu, z kosztami spójności.", defined_at: "8.51", used_in: "8.43, 8.47, 8.53–8.55, 10.15", refs: [R-8.51.1]}
  - {en: "Alae Sociorum (AS)", pl: "ale sprzymierzeńców (alae sociorum)", kind: descriptive, definition: "Oddziały sprzymierzeńców Rzymu; żetony z „AS” i numerem (np. AS/XIX). Nie mylić z AS = przewaga ataku.", defined_at: "2.4, 2.23", used_in: "4.51–4.54, 6.63", refs: [R-2.23.2]}
  - {en: "Archer (A)", pl: "łucznik", kind: technical, definition: "Klasa broni miotanej A; łucznicy strzelają nad bliższymi jednostkami (8.14).", defined_at: "2.21, 8.11", used_in: "8.14, 8.17, 8.31", refs: [R-2.21.2, R-8.14.3]}
  - {en: "Army Withdrawal / Withdrawal Level", pl: "wycofanie armii / próg wycofania", kind: technical, definition: "Armia wycofuje się (przegrywa), gdy jej punkty ucieczki ≥ progowi wycofania ze scenariusza.", defined_at: "11.2", used_in: "3.0 E, 9.72", refs: [R-11.2.2]}
  - {en: "Attack Superiority (AS) / Defense Superiority (DS)", pl: "przewaga ataku / przewaga obrony", kind: technical, definition: "Wynik kroku 1 walki wręcz; AS podwaja trafienia obrońcy, DS potraja trafienia atakującego.", defined_at: "8.46", used_in: "6.75, 8.54, 9.15, 9.53", refs: [R-8.46.1, R-8.46.8]}
  - {en: "Barbarian Infantry (BI)", pl: "piechota barbarzyńska", kind: technical, definition: "Typ piechoty plemiennej; furia, porywczość, bez kolumny/PW/OW, osłabiona ginie przy ucieczce.", defined_at: "2.4, 9.9", used_in: "6.71, 7.14, 8.43, 9.91–9.95, 10.32", refs: [R-9.91.1, R-9.94.1]}
  - {en: "BC (cavalry type in 8.66)", pl: "BC (nieobjaśnione)", kind: descriptive, definition: "Skrót typu jazdy w opcji 8.66 (wartość pościgu 3), nieobjaśniony w instrukcji.", defined_at: "8.66", used_in: "8.66", refs: [R-8.66.1, N-14]}
  - {en: "Break-Off", pl: "przerwanie (pościgu)", kind: technical, definition: "Wynik rzutu na pościg ≤ TQ: jazda posuwa się po walce zamiast ścigać.", defined_at: "8.62", used_in: "8.63", refs: [R-8.62.5]}
  - {en: "Bypassed Leader", pl: "dowódca pominięty", kind: technical, definition: "Nieaktywny dowódca (dowolnej strony) z inicjatywą ≤ dowódcy, który skutecznie przejął aktywację; może być aktywowany, ale bez impetu.", defined_at: "5.44", used_in: "5.31", refs: [R-5.44.2]}
  - {en: "Cavalry Line Withdrawal", pl: "wycofanie linii jazdy", kind: technical, definition: "Jednoczesne uporządkowane wycofanie całej linii jazdy.", defined_at: "6.57", used_in: "6.83", refs: [R-6.57.1]}
  - {en: "Cavalry Pursuit / Pursue", pl: "pościg jazdy / ściganie", kind: technical, definition: "Po rozbiciu obrońców w kroku załamania atakująca jazda rzuca: wynik > TQ — musi ścigać.", defined_at: "8.6", used_in: "8.42, 8.47", refs: [R-8.61.1, R-8.62.1]}
  - {en: "Charge (Pre-Shock TQ Check)", pl: "szarża (test TQ przed walką)", kind: technical, definition: "Krok walki wręcz: jednostki z SHOCK MUST CHECK TQ i ich cele wykonują test TQ.", defined_at: "8.43", used_in: "3.0 B.2, 9.11, 9.23", refs: [R-8.43.1]}
  - {en: "Charisma", pl: "charyzma", kind: technical, definition: "Parametr dowódcy modyfikujący rzut na CRT walki wręcz dla jednostek w jego stosie.", defined_at: "4.1", used_in: "8.44, 8.46, 8.66", refs: [R-4.1.6, R-8.46.7]}
  - {en: "Class", pl: "klasa", kind: technical, definition: "Podkategoria typu (np. HA, PR, TR, CO w typie LG; HO w typie HI).", defined_at: "2.22, 2.4", used_in: "4.52, 6.63, 9.63", refs: [R-2.22.1]}
  - {en: "Clash of Spears and Swords Chart", pl: "Tabela starcia włóczni i mieczy", kind: technical, definition: "Tabela dająca bazową kolumnę CRT wg typów i kąta ataku.", defined_at: "8.45, 8.73", used_in: "2.4, 10.13", refs: [R-8.45.1, T-25]}
  - {en: "Cohesion", pl: "spójność", kind: technical, definition: "Zdolność jednostki do utrzymania szyku; mierzona trafieniami.", defined_at: "2.4, 10.1", used_in: "passim", refs: [R-2.4.2, R-10.1.1]}
  - {en: "Cohesion Hit (Hit)", pl: "trafienie", kind: technical, definition: "Jednostka utraty spójności; trafienia ≥ TQ = ucieczka.", defined_at: "2.4, 10.12", used_in: "passim", refs: [R-10.12.1, R-10.14.1]}
  - {en: "Cohesion Hit and TQ Check Chart", pl: "Tabela trafień i testów TQ", kind: technical, definition: "Karta PAC podsumowująca momenty trafień i testów TQ.", defined_at: "8.75", used_in: "2.4, 10.1, 10.11", refs: [R-8.75.1, T-28]}
  - {en: "Collapse", pl: "załamanie", kind: technical, definition: "Ostatni krok walki wręcz: ucieczki, testy TQ − 1 w strefie kontroli, posunięcia i pościgi.", defined_at: "8.47", used_in: "8.61, 10.15", refs: [R-8.47.1]}
  - {en: "Column / In Column", pl: "kolumna / w kolumnie", kind: technical, definition: "Szyk marszowy piechoty: MA +1, TQ −2, bez walki wręcz i ostrzału.", defined_at: "6.7", used_in: "4.32, 6.51, 7.11, 7.33", refs: [R-6.71.1, R-6.75.1]}
  - {en: "Combat unit", pl: "jednostka bojowa", kind: technical, definition: "Żeton wojska (w odróżnieniu od dowódców i znaczników); słoń dowódcy też jest jednostką bojową.", defined_at: "2.2", used_in: "passim", refs: [R-2.2.1, R-4.83.1]}
  - {en: "Command Range", pl: "zasięg dowodzenia", kind: technical, definition: "Odległość w heksach (ścieżka bez przeszkód; liczy się heks jednostki, nie dowódcy), w jakiej dowódca wydaje rozkazy.", defined_at: "4.1, 4.21", used_in: "4.32–4.34, 5.26, 5.51, 7.33", refs: [R-4.1.1, R-4.21.2]}
  - {en: "Command Restriction", pl: "ograniczenie dowodzenia", kind: technical, definition: "Typ jednostki na żetonie dowódcy — dowódca nie wpływa na inne typy.", defined_at: "4.1, 4.35", used_in: "4.52, 7.33", refs: [R-4.1.8, R-4.35.1]}
  - {en: "Cohort (CO)", pl: "kohorta", kind: descriptive, definition: "Klasa piechoty legionowej/al wymieniana w przykładach (HA/PR/CO/TR).", defined_at: "6.63 (przykład)", used_in: "s. 28 (przykład)", refs: [R-6.63.2]}
  - {en: "Depleted / Depletion", pl: "osłabiona / osłabienie", kind: technical, definition: "Trwały stan po reorganizacji (lub od początku scenariusza): żeton na rewersie; 1L w ataku, 1R w obronie, +1 DRM do ostrzału.", defined_at: "2.4, 10.3", used_in: "2.21, 9.93, 10.28", refs: [R-10.31.1, R-10.32.1]}
  - {en: "Die Roll of Doom", pl: "rzut zagłady", kind: technical, definition: "Przerzut po wyniku 9 na impet: 0–1 ponowna aktywacja przeciwnika, 2–8 skończony, 9 koniec aktywacji.", defined_at: "5.33", used_in: "5.11, 5.34", refs: [R-5.33.1]}
  - {en: "Double Depth (DD) Phalanx", pl: "falanga podwójnej głębokości", kind: technical, definition: "Dwie falangi w jednym heksie (rozkaz OC); szczególne zasady ruchu i walki.", defined_at: "9.5", used_in: "6.61, 8.43", refs: [R-9.51.1, R-9.53.1]}
  - {en: "DR / DRM", pl: "rzut kością / modyfikator rzutu", kind: technical, definition: "DR — wynik k10 (0 = 0); DRM — wartość dodawana do wyniku lub odejmowana.", defined_at: "2.4, 2.3", used_in: "passim", refs: [R-2.4.3, R-2.3.1]}
  - {en: "Elephant Leader (optional)", pl: "dowódca słoni (opcja)", kind: technical, definition: "Specjalny żeton z zasady opcjonalnej 4.9 (inicjatywa 1), wydający jeden LC linii słoni. Nie mylić ze słoniem dowódcy.", defined_at: "4.91", used_in: "4.92–4.94", refs: [R-4.91.1]}
  - {en: "Leader Elephant", pl: "słoń dowódcy", kind: technical, definition: "Hybrydowa jednostka bojowa (Size 1) niosąca dowódcę (Hannibal); tylko broni się, nie ma ZOC ani osłon.", defined_at: "4.8", used_in: "4.72, 6.15, 9.14, 10.13, 11.1", refs: [R-4.81.1, R-4.83.1]}
  - {en: "Elephant Pass-Thru", pl: "przepuszczenie słonia", kind: technical, definition: "Piechota atakowana od frontu przez słonia przepuszcza go przez swój heks.", defined_at: "9.11", used_in: "6.62, 7.15, 9.24", refs: [R-9.11.1]}
  - {en: "Elephant Rampage", pl: "szał słonia", kind: technical, definition: "Ucieczka słonia: niekontrolowany bieg wg rzutów kierunku.", defined_at: "9.14", used_in: "4.84, 6.51, 6.56, 8.2, 10.21", refs: [R-9.14.1]}
  - {en: "Elephant Screen", pl: "osłona słonia", kind: technical, definition: "Lekkie wsparcie łuczników przy słoniu (małe „a”); tylko ostrzał reakcyjny.", defined_at: "9.12", used_in: "8.17, 8.25", refs: [R-9.12.1]}
  - {en: "Elite Commander / Elite Initiative Orders (EIO) Phase", pl: "dowódca elitarny / faza inicjatywy elitarnej (EIO)", kind: technical, definition: "Dowódca z ▲; jego strona może zacząć turę jedną fazą EIO.", defined_at: "4.1, 5.51", used_in: "5.13, 5.14, 5.34, 6.81", refs: [R-4.1.2, R-5.51.1]}
  - {en: "Engaged (optional)", pl: "związana (opcja)", kind: technical, definition: "Stan jednostek po walce wręcz, które zostały w miejscu: bez ruchu i ostrzału, obowiązkowa walka.", defined_at: "10.4", used_in: "7.33, 8.47, 8.61, 10.16, 10.28", refs: [R-10.41.1]}
  - {en: "Entry Reaction / Retire Reaction / Return Fire", pl: "ostrzał przy wejściu / przy wyjściu / odwetowy", kind: technical, definition: "Trzy rodzaje ostrzału reakcyjnego (zasięg 1 / 2 / odpowiedź na ostrzał).", defined_at: "8.21–8.23", used_in: "6.66, 7.15, 8.33, 8.55", refs: [R-8.21.1, R-8.22.1, R-8.23.1]}
  - {en: "Extended Range", pl: "zasięg wydłużony", kind: technical, definition: "Ostrzał celu niżej położonego: zasięg +1, trafienie tylko na 0.", defined_at: "8.16", used_in: "—", refs: [R-8.16.1]}
  - {en: "Extended Movement Allowance (Phalanx)", pl: "rozszerzony limit punktów ruchu (falanga)", kind: technical, definition: "Drugi MA falangi (5) — z kosztem spójności; używany też przy 7.23 i 6.51.", defined_at: "2.25, 6.41", used_in: "6.51, 6.72, 7.23", refs: [R-6.41.1]}
  - {en: "Ferocity", pl: "furia", kind: technical, definition: "Stan BI na początku gry: −1 DRM do własnego, +2 DRM do testu przeciwnika przed walką.", defined_at: "9.94", used_in: "8.43", refs: [R-9.94.1]}
  - {en: "Finished Leader", pl: "dowódca skończony", kind: technical, definition: "Dowódca, który zakończył aktywację (lub z innych przyczyn 5.15); zwykle nie może być ponownie aktywowany.", defined_at: "2.4, 5.15", used_in: "4.25, 5.33, 6.83", refs: [R-2.4.4, R-5.15.1]}
  - {en: "Front / Flank / Rear hexes", pl: "heksy frontowe / boczne / tylne", kind: technical, definition: "Heksy wokół jednostki wg ukierunkowania (jednoheksowa 2/2/2; falanga 3/2/3; kolumna 1/4/1).", defined_at: "7.11", used_in: "6.73, 8.13, 8.46", refs: [R-7.11.1, R-6.73.1]}
  - {en: "Front-to-Flank Maneuver", pl: "manewr front-bok", kind: technical, definition: "Obrót falangi: jedna połowa wchodzi do heksu, druga obraca się w miejscu; 1 trafienie za heks.", defined_at: "6.43", used_in: "6.44, 7.13", refs: [R-6.43.1]}
  - {en: "Gallic Chariot (CH)", pl: "rydwan galijski", kind: technical, definition: "Środek transportu LI (bez Size i TQ).", defined_at: "9.96", used_in: "—", refs: [R-9.96.2]}
