  - {en: "Size and Troop Quality chart / Rout Ratio", pl: "tabela Size i TQ / wskaźnik ucieczki (Rout Ratio)", kind: descriptive, definition: "Statystyki armii w warunkach zwycięstwa: jednostki, Size, RP, stosunek progu wycofania do RP, średnie TQ.", defined_at: "księga, s. 2 (R-SC0-3)", used_in: "T-42", refs: [R-SC0-3, T-42]}
  - {en: "Charisma “2C”", pl: "charyzma „2C”", kind: technical, definition: "Charyzma Masynissy (2) działająca tylko w stosie z jednostką jazdy numidyjskiej.", defined_at: "Zama, s. 20 (R-SC4-4)", used_in: "T-46", refs: [R-SC4-4]}
confusables:
  - {text: "**LC** = Line Command (rozkaz liniowy, 2.4, 4.3) **≠** LC = Light Cavalry (lekka jazda, 8.31, 9.3). Liczba przed skrótem („2 LC”, „wartość LC”) — rozkaz; typ jednostki („LC Archers”, „Numidian LC”) — jazda."}
  - {text: "**Leader Elephant** (słoń dowódcy, 4.8 — Hannibal) **≠** **Elephant Leader** (dowódca słoni, opcja 4.9 — żeton z inicjatywą 1)."}
  - {text: "**Rally** (reorganizacja uciekającej jednostki, 10.28) **≠** **Recovery** (odzyskanie spójności — usunięcie trafień, 10.16)."}
  - {text: "**Rout** (ucieczka, 10.2) ≠ **Orderly Withdrawal** (uporządkowane wycofanie, 6.5) ≠ **Pre-Arranged Withdrawal** (6.8) ≠ **Cavalry Line Withdrawal** (6.57) ≠ **Army Withdrawal** (wycofanie armii = przegrana, 11.2) ≠ **Break-Off** (przerwanie pościgu, 8.62) ≠ odstąpienie związanych o 1 heks (10.42) ≠ odskok dowódcy (4.72)."}
  - {text: "**Command Range** (zasięg dowodzenia, 4.21) **≠** **Missile Range** (zasięg ostrzału, MRRC 8.15) ≠ zasięg 2 heksów wyzwalający OW (6.51)."}
  - {text: "**TQ rating** (wartość) ≠ **TQ Check** (test, 10.11) ≠ **Pre-Shock TQ Check** (test przed walką, 8.43) ≠ test załamania (8.47 pkt 2) ≠ test przepuszczenia (9.11)."}
  - {text: "**AS** = Attack Superiority (przewaga ataku, 8.46) **≠** AS = Alae Sociorum (oznaczenie żetonu „AS/XIX”, 2.23)."}
  - {text: "**Finished** (skończony) ≠ **Inactive** (nieaktywny) ≠ **Bypassed** (pominięty — może działać, ale bez impetu) ≠ dowódca po fazie EIO (nieaktywny, nie skończony, 5.52)."}
  - {text: "**Trumping the Trump** (5.42 pkt 1 — po udanym przejęciu) ≠ **Momentum Trump** (5.42 pkt 2 — po udanym impecie)."}
  - {text: "**SHOCK MUST CHECK TQ** (atak po podejściu, test przed walką) ≠ **SHOCK NO TQ CHECK** (atak z wyboru bez podejścia, bez testu)."}
  - {text: "**Advance after Combat** (posunięcie, 8.5) ≠ **Pursuit** (pościg jazdy, 8.6)."}
  - {text: "**Class** (HA, PR, TR, CO, HO…) ≠ **Type** (HI, LG, LI, SK, PH…)."}
  - {text: "**Front/Flank/Rear hex** (heks frontowy/boczny/tylny) ≠ historyczne „flank” (skrzydło szyku) w komentarzach."}
  - {text: "**Moved** (znacznik MOVED: jednostka ruszała się już w turze, 6.13/6.41) ≠ **moved adjacent** (weszła obok wroga w tym segmencie, 7.31)."}
  - {text: "**Elephant Rampage** (szał — „ucieczka” słonia, 9.14) ≠ zwykły ruch ucieczki (10.22)."}
  - {text: "**double depth** w Bagradas (opisowo — głęboki szyk manipułów, jednostki bez stosów, R-SC2-3) **≠** **Double Depth Phalanx** (formacja falangi, 9.5)."}
