  - {en: "Javelinist (J)", pl: "oszczepnik", kind: technical, definition: "Klasa broni miotanej J (oszczepy, w tym pila).", defined_at: "2.21, 8.11", used_in: "8.15, 8.17", refs: [R-2.21.2, R-8.17.1]}
  - {en: "Leader", pl: "dowódca", kind: technical, definition: "Żeton dowodzący (Leader = Commander).", defined_at: "2.4, 4.0", used_in: "passim", refs: [R-2.4.5]}
  - {en: "Leader Casualty Table", pl: "Tabela strat dowódców", kind: technical, definition: "Karta PAC; rzut po wyniku 0 przy stracie dowódcy.", defined_at: "4.73", used_in: "8.19, 8.44, 9.14", refs: [R-4.73.1, T-23]}
  - {en: "Legion Infantry (LG)", pl: "piechota legionowa", kind: technical, definition: "Typ obejmujący hastatów, principes i kohorty (miecz, scutum).", defined_at: "2.4", used_in: "4.52, 6.52, 8.17, 9.23", refs: [R-2.4.12]}
  - {en: "Light Cavalry (LC)", pl: "lekka jazda", kind: technical, definition: "Typ jazdy (konni oszczepnicy/łucznicy); H&D przeciw wolniejszym. Skrót LC jak Line Command.", defined_at: "2.4, 9.3", used_in: "8.31–8.34, 8.46, 8.66", refs: [R-9.31.1, R-9.32.1]}
  - {en: "Light Infantry (LI)", pl: "lekka piechota", kind: technical, definition: "Typ piechoty bez pancerzy (także velites); szczególne zasady 8.43, 9.23.", defined_at: "2.4, 9.2", used_in: "8.31, 8.43, 9.81, 9.96", refs: [R-9.2.1, R-9.23.2]}
  - {en: "Line", pl: "linia", kind: technical, definition: "Jednostki z karty uprawnień do LC, spełniające wymogi przyległości i wspólnego ustawienia.", defined_at: "2.4, 4.32", used_in: "4.31, 6.57, 6.81, 9.24, 9.66", refs: [R-2.4.6, R-4.32.1]}
  - {en: "Line Command (LC)", pl: "rozkaz liniowy", kind: technical, definition: "Rozkaz dla całej linii (ruch albo ostrzał); zamiast IO.", defined_at: "2.4, 4.3", used_in: "passim", refs: [R-4.31.1, R-5.23.1]}
  - {en: "Line Command Eligibility Chart", pl: "karta uprawnień do rozkazów liniowych", kind: technical, definition: "Karta scenariusza określająca skład linii i odstępy.", defined_at: "4.31", used_in: "2.4, 4.32, 4.53, 4.54, 6.57", refs: [R-4.31.1, T-29]}
