  - {en: "Harassment & Dispersal (H&D)", pl: "ostrzał nękający", kind: technical, definition: "Ostrzał lekkich jednostek z podejściem i powrotem (bez przesuwania żetonu), z zasięgu 1, zużywający cały MA.", defined_at: "8.3", used_in: "9.22, 9.31, 10.16, 10.28", refs: [R-8.31.1, R-8.33.1]}
  - {en: "Heavy units (+)", pl: "jednostki ciężkie (+)", kind: technical, definition: "Typy z plusem w Tabeli przewagi; po podejściu muszą atakować wręcz.", defined_at: "7.31", used_in: "7.32", refs: [R-7.31.1]}
