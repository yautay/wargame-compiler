  - {en: "Volturnus", pl: "Volturnus (wiatr z pyłem)", kind: technical, definition: "Opcja Kann: faza Volturnus przed aktywacją; przy wietrze MA –1 dla jednostek zwróconych na W/SW i słabszy ostrzał rzymski.", defined_at: "Kanny, s. 15 (R-SC3-15)", used_in: "R-SC3-1", refs: [R-SC3-15, N-41]}
  - {en: "Old Guard / Levies", pl: "Stara Gwardia / zaciąg", kind: technical, definition: "Zama: weterani (afrykańskie falangi, HI z Bruttium) mogą reorganizować uciekających północnoafrykańskich LI i kartagiński zaciąg (MI).", defined_at: "Zama, s. 21 (R-SC4-9)", used_in: "T-46", refs: [R-SC4-9, N-45]}
