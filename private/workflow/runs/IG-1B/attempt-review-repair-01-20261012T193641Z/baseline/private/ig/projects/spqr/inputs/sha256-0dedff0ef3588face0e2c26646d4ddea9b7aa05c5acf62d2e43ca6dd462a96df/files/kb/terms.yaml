  - {en: "Impetuosity", pl: "porywczość", kind: technical, definition: "Stan BI na początku gry: MA +1, −1 do pierwszego rzutu na impet dowódcy.", defined_at: "9.95", used_in: "—", refs: [R-9.95.1]}
  - {en: "Inactive Leader", pl: "dowódca nieaktywny", kind: technical, definition: "Dowódca jeszcze nieaktywowany i uprawniony do aktywacji.", defined_at: "2.4", used_in: "5.11, 5.41, 5.52", refs: [R-2.4.4]}
