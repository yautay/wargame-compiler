[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Own distribution and CLI names: must not collide with the legacy `wgu` tool (C:/dev/wargame_utils). See ADR-0002.
name = "wargame-compiler"
version = "0.0.1"
description = "Rulebook compiler for board wargames: canonical logic model, digitalization spec, editorial model, translation and publication"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "referencing>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["wgc*", "glu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
