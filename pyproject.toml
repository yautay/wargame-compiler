[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Own distribution and CLI names: must not collide with the legacy `wgu` tool (C:/dev/wargame_utils). See ADR-0002.
name = "wargame-compiler"
version = "0.0.1"
description = "Rulebook compiler for board wargames: canonical logic model, digitalization spec, editorial model, translation and publication"
requires-python = ">=3.10"
# PDF stack (ADR-0021): pdfplumber/pdfminer.six (MIT), pypdfium2 (Apache-2.0/BSD-3), Pillow (MIT-CMU); not PyMuPDF (AGPL).
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "referencing>=0.30", "pdfplumber>=0.11.10", "pypdfium2>=5.9", "pillow>=12.2"]

[project.scripts]
wgc = "wgc.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["wgc*", "glu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
